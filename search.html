<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .hidden { display:none !important; }
  .spinner { border:2px solid rgba(255,255,255,.15); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-24 relative">
  <header class="px-4 py-4 bg-darkcard border-b border-slate-900">
    <h1 class="text-sm font-black uppercase tracking-widest text-slate-300 mb-3">Search</h1>
    <div class="relative">
      <input type="text" id="search-input" placeholder="Search users or posts..."
        class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none pl-10">
      <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <div id="search-spinner" class="spinner absolute right-3 top-1/2 -translate-y-1/2 hidden"></div>
    </div>
  </header>

  <main class="px-4 py-4 space-y-4">
    <div id="hint" class="text-center text-slate-600 text-xs py-10">
      <svg class="w-12 h-12 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <p>Search for people you know or posts that interest you</p>
    </div>

    <div id="results-users" class="space-y-2 hidden">
      <h4 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 pl-1">Matching Identities</h4>
      <div id="users-list" class="space-y-2"></div>
    </div>

    <div id="results-posts" class="space-y-3 hidden">
      <h4 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 pl-1">Matching Publications</h4>
      <div id="posts-list" class="space-y-3"></div>
    </div>

    <div id="empty" class="hidden text-center text-slate-600 text-xs py-10">
      <p class="font-bold text-sm text-slate-500">No results found</p>
      <p class="mt-1">Try a different keyword.</p>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkcard/95 backdrop-blur-md border-t border-slate-900 h-16 flex justify-around items-center z-40">
    <a href="main.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="chat.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </a>
    <a href="reels.html" class="text-slate-500 hover:text-pink-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </a>
    <a href="search.html" class="text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </a>
    <a href="profile.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z"/></svg>
    </a>
  </nav>
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/auth.js".replace('/auth.js','/firebase-auth.js');
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  let ME = null;
  let USERS = [];
  let POSTS = [];
  let FRIENDS = {};

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  // ---- Auth gate + one-shot cache of users & posts ----
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    const [usersSnap, postsSnap, friendsSnap] = await Promise.all([
      get(ref(db, 'users')),
      get(ref(db, 'publications')),
      get(ref(db, 'friendships'))
    ]);

    const usersData = usersSnap.val() || {};
    USERS = Object.keys(usersData).map(k => usersData[k]).filter(u => u && u.uid);
    for (const u of USERS) {
      if (u.realFirebaseUID === user.uid) { ME = u; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    const postsData = postsSnap.val() || {};
    POSTS = Object.keys(postsData).map(k => postsData[k]).filter(p => p && (p.text || p.image));

    FRIENDS = friendsSnap.val() || {};

    // Auto focus
    document.getElementById('search-input').focus();
  });

  // ---- Debounced search ----
  let debounceTimer = null;
  const input = document.getElementById('search-input');
  const spinner = document.getElementById('search-spinner');

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim().toLowerCase();
    if (!q) {
      renderEmptyHint();
      return;
    }
    spinner.classList.remove('hidden');
    debounceTimer = setTimeout(() => runSearch(q), 300);
  });

  function renderEmptyHint() {
    document.getElementById('hint').classList.remove('hidden');
    document.getElementById('results-users').classList.add('hidden');
    document.getElementById('results-posts').classList.add('hidden');
    document.getElementById('empty').classList.add('hidden');
    spinner.classList.add('hidden');
  }

  function runSearch(q) {
    spinner.classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('empty').classList.add('hidden');

    // Users match
    const matchedUsers = USERS.filter(u =>
      u.uid !== ME.uid &&
      (u.uid.includes(q) || (u.name || '').toLowerCase().includes(q))
    ).slice(0, 20);

    // Posts match
    const matchedPosts = POSTS.filter(p =>
      (p.text || '').toLowerCase().includes(q)
    ).sort((a,b) => b.timestamp - a.timestamp).slice(0, 30);

    if (!matchedUsers.length && !matchedPosts.length) {
      document.getElementById('results-users').classList.add('hidden');
      document.getElementById('results-posts').classList.add('hidden');
      document.getElementById('empty').classList.remove('hidden');
      return;
    }

    // Users
    const usersBox = document.getElementById('results-users');
    const usersList = document.getElementById('users-list');
    usersList.innerHTML = '';
    if (matchedUsers.length) {
      usersBox.classList.remove('hidden');
      matchedUsers.forEach(u => usersList.appendChild(buildUserRow(u)));
    } else usersBox.classList.add('hidden');

    // Posts
    const postsBox = document.getElementById('results-posts');
    const postsList = document.getElementById('posts-list');
    postsList.innerHTML = '';
    if (matchedPosts.length) {
      postsBox.classList.remove('hidden');
      matchedPosts.forEach(p => postsList.appendChild(buildPostRow(p)));
    } else postsBox.classList.add('hidden');
  }

  function buildUserRow(u) {
    const isFriend = FRIENDS[`bond_${ME.uid}_and_${u.uid}`] === 'confirmed';
    const sent = FRIENDS[`req_${ME.uid}_to_${u.uid}`] === 'pending';
    const incoming = FRIENDS[`req_${u.uid}_to_${ME.uid}`] === 'pending';

    const card = document.createElement('div');
    card.className = 'bg-darkcard p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs';

    let action = '';
    if (isFriend) action = `<span class="text-[10px] bg-slate-800 text-cyan-400 font-bold px-3 py-1.5 rounded-xl border border-slate-700">Verified</span>`;
    else if (sent) action = `<span class="text-[10px] bg-slate-800 text-slate-500 px-3 py-1.5 rounded-xl">Sent</span>`;
    else if (incoming) action = `<button data-accept class="bg-emerald-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl">Accept</button>`;
    else action = `<button data-connect class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl transition">Connect</button>`;

    card.innerHTML = `
      <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer" data-goto>
        <img src="${u.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-9 h-9 rounded-full object-cover">
        <div class="min-w-0">
          <p class="font-bold text-slate-200 truncate">${u.name}</p>
          <p class="text-[9px] text-slate-500 font-mono">@${u.uid}</p>
        </div>
      </div>
      <div>${action}</div>
    `;

    card.querySelector('[data-goto]').addEventListener('click', () => {
      window.location.href = 'profile.html?uid=' + encodeURIComponent(u.uid);
    });

    const connectBtn = card.querySelector('[data-connect]');
    if (connectBtn) connectBtn.addEventListener('click', async () => {
      await set(ref(db, `friendships/req_${ME.uid}_to_${u.uid}`), 'pending');
      toast('Request Sent', 'Friend request sent');
      FRIENDS[`req_${ME.uid}_to_${u.uid}`] = 'pending';
      connectBtn.outerHTML = `<span class="text-[10px] bg-slate-800 text-slate-500 px-3 py-1.5 rounded-xl">Sent</span>`;
    });

    const acceptBtn = card.querySelector('[data-accept]');
    if (acceptBtn) acceptBtn.addEventListener('click', async () => {
      const { update } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js");
      const updates = {};
      updates[`friendships/req_${u.uid}_to_${ME.uid}`] = null;
      updates[`friendships/bond_${ME.uid}_and_${u.uid}`] = 'confirmed';
      updates[`friendships/bond_${u.uid}_and_${ME.uid}`] = 'confirmed';
      await update(ref(db), updates);
      toast('Connected', 'Friend request accepted');
      FRIENDS[`bond_${ME.uid}_and_${u.uid}`] = 'confirmed';
      acceptBtn.outerHTML = `<span class="text-[10px] bg-slate-800 text-cyan-400 font-bold px-3 py-1.5 rounded-xl border border-slate-700">Verified</span>`;
    });

    return card;
  }

  function buildPostRow(p) {
    const card = document.createElement('div');
    card.className = 'bg-darkcard p-3 rounded-xl border border-slate-800 text-xs space-y-2';
    card.innerHTML = `
      <div class="flex items-center gap-2 cursor-pointer" data-author>
        <img src="${p.authorAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-6 h-6 rounded-full object-cover">
        <span class="text-[10px] text-slate-400 font-bold">${p.authorName}</span>
      </div>
      ${p.text ? `<p class="text-slate-300 leading-relaxed">${p.text}</p>` : ''}
      ${p.image ? `<div class="rounded-lg overflow-hidden max-h-32 border border-slate-800"><img src="${p.image}" class="w-full h-full object-cover" loading="lazy"></div>` : ''}
      <p class="text-[9px] text-slate-600 font-mono">@${p.authorUID} • ${new Date(p.timestamp).toLocaleDateString()}</p>
    `;
    card.querySelector('[data-author]').addEventListener('click', () => {
      if (p.authorUID === ME.uid) window.location.href = 'profile.html';
      else window.location.href = 'profile.html?uid=' + encodeURIComponent(p.authorUID);
    });
    return card;
  }
</script>
</body>
</html>
