<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b1528;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  body.light { background: #f0f2f5; color: #1a1a2e; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #06b6d4;
    animation: spin 0.7s linear infinite;
    margin-bottom: 18px;
  }
  body.light .spinner { border-color: rgba(0,0,0,0.1); border-top-color: #2563eb; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 22px; font-weight: 900; letter-spacing: 0.15em;
    background: linear-gradient(90deg, #06b6d4, #3b82f6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 11px; opacity: 0.6; margin-top: 6px; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>STARDUST</h1>
  <p id="status">Initializing...</p>

<script type="module">
  // Apply saved theme before anything else (prevents flash)
  const savedTheme = localStorage.getItem('stardust_theme') || 'light';
  if (savedTheme === 'light') document.body.classList.add('light');

  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400",
    measurementId: "G-DZM4TXN2N2"
  };

  initializeApp(firebaseConfig);
  const auth = getAuth();

  // Safety fallback — never let user get stuck
  const fallback = setTimeout(() => {
    document.getElementById('status').textContent = 'Redirecting...';
    window.location.replace('auth.html');
  }, 4000);

  onAuthStateChanged(auth, (user) => {
    clearTimeout(fallback);
    if (user) {
      document.getElementById('status').textContent = 'Welcome back';
      window.location.replace('main.html');
    } else {
      document.getElementById('status').textContent = 'Redirecting to sign in...';
      window.location.replace('auth.html');
    }
  });
</script>
</body>
</html>
