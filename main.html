<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .bg-slate-900\/50 { background:rgba(245,245,248,.5) !important; }
  body.light-mode .bg-slate-800\/40 { background:rgba(232,232,238,.4) !important; }
  body.light-mode .hover\:bg-slate-300:hover { background:#d8d8de !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.light-mode .bg-darkbg\/95 { background:rgba(240,242,245,.95) !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .custom-scrollbar::-webkit-scrollbar { width:4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background:#334155; border-radius:10px; }
  body.light-mode .custom-scrollbar::-webkit-scrollbar-thumb { background:#c0c0cc; }
  .hidden { display:none !important; }
  .spinner { border:2px solid rgba(255,255,255,.1); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background:linear-gradient(90deg,#1e293b 25%,#2a3a4a 50%,#1e293b 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
  body.light-mode .skeleton { background:linear-gradient(90deg,#e8e8ee 25%,#f0f0f5 50%,#e8e8ee 75%); background-size:200% 100%; }
  @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
  .notif-badge { position:absolute; top:-4px; right:-4px; background:#ef4444; color:#fff; font-size:9px; font-weight:700; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; }
  .post-menu-btn { opacity:.6; padding:4px; border-radius:8px; background:transparent; border:none; cursor:pointer; color:inherit; transition:opacity .2s; }
  .post-menu-btn:hover { opacity:1; background:rgba(128,128,128,.2); }
  .post-menu-dropdown { position:fixed; background:#1e293b; border-radius:12px; border:1px solid #334155; padding:6px; min-width:150px; z-index:50; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .post-menu-dropdown button { display:block; width:100%; text-align:left; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:500; background:transparent; border:none; color:#e2e8f0; cursor:pointer; }
  .post-menu-dropdown button:hover { background:#334155; }
  .post-menu-dropdown .delete-btn { color:#ef4444; }
  body.light-mode .post-menu-dropdown { background:#fff; border-color:#e4e6eb; }
  body.light-mode .post-menu-dropdown button { color:#1a1a2e; }
  body.light-mode .post-menu-dropdown button:hover { background:#f0f2f5; }
  #img-viewer { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  #img-viewer img { max-width:100%; max-height:80vh; border-radius:12px; }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-24 relative">
  <main class="px-4 py-3">
    <header class="py-4 border-b border-slate-900 flex justify-between items-center mb-3">
      <h1 class="text-xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-cyan-400">STARDUST</h1>
      <div class="flex items-center gap-3">
        <a href="notifications.html" class="relative p-2 bg-slate-800/50 rounded-full border border-slate-700 hover:bg-slate-700 transition">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notif-badge" class="notif-badge hidden">0</span>
        </a>
        <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full transition shadow-lg shadow-blue-600/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        </a>
      </div>
    </header>

    <!-- Skeleton loaders shown before feed arrives -->
    <div id="feed-skeleton" class="space-y-4">
      <div class="skeleton h-24"></div>
      <div class="skeleton h-24"></div>
      <div class="skeleton h-24"></div>
    </div>

    <div id="feed" class="space-y-4"></div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkcard/95 backdrop-blur-md border-t border-slate-900 h-16 flex justify-around items-center z-40">
    <a href="main.html" class="text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="chat.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </a>
    <a href="reels.html" class="text-slate-500 hover:text-pink-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </a>
    <a href="search.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </a>
    <a href="profile.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z"/></svg>
    </a>
  </nav>
</div>

<div id="img-viewer" class="hidden">
  <button id="close-viewer" class="absolute top-4 right-4 text-white bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Close</button>
  <img id="viewer-img" src="">
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, remove, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Theme
  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  // ---- Local state for THIS page only ----
  let ME = null;       // current user object from /users/{uid}
  let POSTS = [];      // publications (sorted desc)

  // ---- Toast helper ----
  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  function openImg(src) {
    document.getElementById('viewer-img').src = src;
    document.getElementById('img-viewer').classList.remove('hidden');
  }
  window._openImg = openImg;
  document.getElementById('close-viewer').addEventListener('click', () => {
    document.getElementById('img-viewer').classList.add('hidden');
  });

  // ---- Auth gate + load profile ----
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    // Fetch minimal current user record (single read, no listener)
    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    for (const k of Object.keys(users)) {
      if (users[k] && users[k].realFirebaseUID === user.uid) { ME = users[k]; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    // Notification badge: single read (not live)
    refreshNotifBadge();

    // Live feed listener — ONLY on main.html
    const feedRef = ref(db, 'publications');
    onValue(feedRef, (snap) => {
      const data = snap.val() || {};
      POSTS = Object.keys(data)
        .map(k => data[k])
        .filter(p => p && p.id && (p.text || p.image))
        .sort((a,b) => b.timestamp - a.timestamp);
      document.getElementById('feed-skeleton').classList.add('hidden');
      renderFeed();
    });
  });

  async function refreshNotifBadge() {
    if (!ME) return;
    const snap = await get(ref(db, `users/${ME.uid}/notifications`));
    const arr = snap.val() || [];
    const unread = Array.isArray(arr) ? arr.filter(n => !n.read).length : 0;
    const b = document.getElementById('notif-badge');
    if (unread > 0) { b.textContent = unread > 9 ? '9+' : unread; b.classList.remove('hidden'); }
    else b.classList.add('hidden');
  }

  // ---- Feed render ----
  function renderFeed() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';
    if (!POSTS.length) {
      feed.innerHTML = `<div class="text-center text-slate-600 text-xs py-10">No posts yet. Tap + to share something.</div>`;
      return;
    }
    const myUID = ME.uid;
    const fontClass = (ME.isPremium && ME.premiumFont) ? ME.premiumFont : '';

    POSTS.forEach(post => {
      const liked = post.likes && post.likes[myUID] === true;
      const likeCount = post.likes ? Object.keys(post.likes).length : 0;
      const commentCount = post.comments ? Object.keys(post.comments).length : 0;
      const saved = Array.isArray(ME.savedPosts) && ME.savedPosts.includes(post.id);
      const isOwner = post.authorUID === myUID;

      const card = document.createElement('div');
      card.className = 'bg-darkcard rounded-2xl border border-slate-800 p-4 space-y-3 text-xs shadow-md relative';
      card.innerHTML = `
        ${isOwner ? `
          <button class="post-menu-btn absolute top-3 right-3" data-post-menu-btn="${post.id}">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>` : ''}
        <div class="flex items-center gap-2.5 cursor-pointer" data-author="${post.authorUID}">
          <img src="${post.authorAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-8 h-8 rounded-full object-cover border border-slate-700" loading="lazy">
          <div>
            <h4 class="font-bold text-slate-200 ${fontClass}">${post.authorName || 'Unknown'}</h4>
            <p class="text-[9px] text-slate-500 font-mono">@${post.authorUID} • ${post.timestamp ? new Date(post.timestamp).toLocaleDateString() : ''}</p>
          </div>
        </div>
        ${post.text ? `<p class="text-slate-300 leading-relaxed break-words ${fontClass}">${post.text}</p>` : ''}
        ${post.image ? `<div class="w-full max-h-52 rounded-xl overflow-hidden bg-slate-900 border border-slate-800 cursor-pointer" data-img><img src="${post.image}" class="w-full h-full object-cover" loading="lazy"></div>` : ''}
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-slate-500">
          <button class="flex items-center gap-1.5 hover:text-red-400 ${liked?'text-red-500 font-bold':''}" data-like>
            <svg class="w-4 h-4" fill="${liked?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            <span data-like-count>${likeCount}</span>
          </button>
          <button class="flex items-center gap-1.5 hover:text-blue-400" data-comment>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            <span>${commentCount}</span>
          </button>
          <button class="flex items-center gap-1.5 hover:text-amber-400 ${saved?'text-amber-400 font-bold':''}" data-save>
            <svg class="w-4 h-4" fill="${saved?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
          </button>
        </div>
      `;

      // Events
      const authorEl = card.querySelector('[data-author]');
      authorEl.addEventListener('click', () => {
        if (post.authorUID === myUID) window.location.href = 'profile.html';
        else window.location.href = 'profile.html?uid=' + encodeURIComponent(post.authorUID);
      });

      const imgEl = card.querySelector('[data-img]');
      if (imgEl) imgEl.addEventListener('click', () => openImg(post.image));

      card.querySelector('[data-like]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(post.id, post.authorUID);
      });

      card.querySelector('[data-comment]').addEventListener('click', () => {
        sessionStorage.setItem('open_post_id', post.id);
        window.location.href = 'create.html#comment';
      });

      card.querySelector('[data-save]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSave(post.id);
      });

      const menuBtn = card.querySelector('[data-post-menu-btn]');
      if (menuBtn) {
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          showPostMenu(post.id, menuBtn);
        });
      }

      feed.appendChild(card);
    });
  }

  // ---- Like ----
  async function toggleLike(postId, authorUID) {
    const snap = await get(ref(db, 'publications'));
    const data = snap.val() || {};
    let key = null;
    for (const k of Object.keys(data)) {
      if (data[k] && data[k].id === postId) { key = k; break; }
    }
    if (!key) return;
    const myUID = ME.uid;
    const wasLiked = data[key].likes && data[key].likes[myUID];
    const likeRef = ref(db, `publications/${key}/likes/${myUID}`);
    if (wasLiked) await remove(likeRef);
    else {
      await set(likeRef, true);
      // fire-and-forget notification
      if (authorUID && authorUID !== myUID) {
        pushNotif(authorUID, {
          type: 'like',
          message: `${ME.name} liked your post`,
          sourceUserId: myUID,
          postId: postId
        });
      }
    }
    // Realtime listener will re-render
  }

  // ---- Save ----
  async function toggleSave(postId) {
    const arr = Array.isArray(ME.savedPosts) ? [...ME.savedPosts] : [];
    const idx = arr.indexOf(postId);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(postId);
    await update(ref(db, `users/${ME.uid}`), { savedPosts: arr });
    ME.savedPosts = arr;
    toast(idx >= 0 ? 'Removed' : 'Saved', idx >= 0 ? 'Post removed from saved' : 'Post saved');
    renderFeed();
  }

  // ---- Post owner menu ----
  function showPostMenu(postId, anchor) {
    document.querySelectorAll('.post-menu-dropdown').forEach(el => el.remove());
    const rect = anchor.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'post-menu-dropdown';
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.right = (window.innerWidth - rect.right) + 'px';
    menu.innerHTML = `
      <button data-action="edit">Edit Post</button>
      <button data-action="delete" class="delete-btn">Delete Post</button>
    `;
    document.body.appendChild(menu);

    const close = (e) => {
      if (!e.target.closest('.post-menu-dropdown') && !e.target.closest('[data-post-menu-btn]')) {
        menu.remove();
        document.removeEventListener('click', close);
      }
    };
    setTimeout(() => document.addEventListener('click', close), 10);

    menu.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      menu.remove();
      if (!confirm('Delete this post?')) return;
      const snap = await get(ref(db, 'publications'));
      const data = snap.val() || {};
      for (const k of Object.keys(data)) {
        if (data[k] && data[k].id === postId) {
          await remove(ref(db, 'publications/' + k));
          toast('Deleted', 'Post removed');
          return;
        }
      }
    });

    menu.querySelector('[data-action="edit"]').addEventListener('click', () => {
      const post = POSTS.find(p => p.id === postId);
      if (!post) return;
      sessionStorage.setItem('edit_post_id', postId);
      window.location.href = 'create.html?edit=1';
    });
  }

  // ---- Notifications helper (write to target user) ----
  async function pushNotif(targetUID, notif) {
    try {
      const notifObj = {
        id: 'n_' + Date.now() + '_' + Math.floor(Math.random()*1000),
        ...notif,
        targetUserId: targetUID,
        timestamp: Date.now(),
        read: false
      };
      const snap = await get(ref(db, `users/${targetUID}/notifications`));
      const list = snap.val() || [];
      const arr = Array.isArray(list) ? list : [];
      arr.unshift(notifObj);
      const cutoff = Date.now() - 7*24*60*60*1000;
      const trimmed = arr.filter(n => n.timestamp > cutoff).slice(0, 50);
      await set(ref(db, `users/${targetUID}/notifications`), trimmed);
    } catch (e) { /* silent */ }
  }
</script>
</body>
</html>
