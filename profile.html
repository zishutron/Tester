<!DOCTYPE html>

<head>

<title>Stardust — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .bg-slate-900\/50 { background:rgba(245,245,248,.5) !important; }
  body.light-mode .bg-slate-800\/60 { background:rgba(232,232,238,.6) !important; }
  body.light-mode .bg-slate-800\/70 { background:rgba(232,232,238,.7) !important; }
  body.light-mode .hover\:bg-slate-300:hover { background:#d8d8de !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.light-mode .border-slate-700 { border-color:#d0d2d6 !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .hidden { display:none !important; }
  .spinner { border:2px solid rgba(255,255,255,.15); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab-btn { transition:all .25s ease; }
  .tab-btn.active { background:#1e293b; color:#06b6d4; }
  .tab-btn:not(.active) { color:#64748b; }
  body.light-mode .tab-btn.active { background:#e8e8ee; color:#2563eb; }
  body.light-mode .tab-btn:not(.active) { color:#6b6b8a; }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
  .skeleton { background:linear-gradient(90deg,#1e293b 25%,#2a3a4a 50%,#1e293b 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
  body.light-mode .skeleton { background:linear-gradient(90deg,#e8e8ee 25%,#f0f0f5 50%,#e8e8ee 75%); background-size:200% 100%; }
  @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }

  /* Premium themes */
  .premium-theme-galaxy { background: linear-gradient(135deg,#0b0a1a,#1a0a3e,#2a0a5e) !important; border-color:#7c3aed !important; color:#e0d7ff !important; box-shadow:0 0 30px rgba(124,58,237,.3) !important; }
  .premium-theme-sunset { background: linear-gradient(135deg,#1a0a0a,#4a1a0a,#7a2a0a) !important; border-color:#f97316 !important; color:#ffedd5 !important; box-shadow:0 0 30px rgba(249,115,22,.3) !important; }
  .premium-theme-ocean { background: linear-gradient(135deg,#0a0a2a,#0a2a5a,#0a4a8a) !important; border-color:#0ea5e9 !important; color:#dbeafe !important; box-shadow:0 0 30px rgba(14,165,233,.3) !important; }
  .premium-theme-forest { background: linear-gradient(135deg,#0a1a0a,#0a3a0a,#0a5a0a) !important; border-color:#22c55e !important; color:#dcfce7 !important; box-shadow:0 0 30px rgba(34,197,94,.3) !important; }
  .premium-theme-rose { background: linear-gradient(135deg,#1a0a1a,#4a0a2a,#7a0a3a) !important; border-color:#ec4899 !important; color:#fce7f3 !important; box-shadow:0 0 30px rgba(236,72,153,.3) !important; }
  .premium-theme-gold { background: linear-gradient(135deg,#1a1a0a,#3a2a0a,#5a3a0a) !important; border-color:#f59e0b !important; color:#fef3c7 !important; box-shadow:0 0 30px rgba(245,158,11,.3) !important; }
  .premium-theme-ice { background: linear-gradient(135deg,#0a1a2a,#0a3a5a,#0a5a8a) !important; border-color:#67e8f9 !important; color:#cffafe !important; box-shadow:0 0 30px rgba(103,232,249,.3) !important; }
  .premium-theme-almond { background: linear-gradient(135deg,#2a1a0a,#4a2a1a,#6a3a2a) !important; border-color:#d4a373 !important; color:#fefae0 !important; box-shadow:0 0 30px rgba(212,163,115,.3) !important; }
  .premium-theme-royal { background: linear-gradient(135deg,#1a0a2a,#2a0a4a,#3a0a6a) !important; border-color:#8b5cf6 !important; color:#ede9fe !important; box-shadow:0 0 30px rgba(139,92,246,.3) !important; }
  .premium-theme-cherry { background: linear-gradient(135deg,#2a0a0a,#4a0a0a,#6a0a0a) !important; border-color:#ef4444 !important; color:#fecaca !important; box-shadow:0 0 30px rgba(239,68,68,.3) !important; }

  .premium-frame-glow { box-shadow:0 0 30px rgba(255,255,255,.3), 0 0 60px rgba(124,58,237,.2) !important; border:3px solid rgba(124,58,237,.6) !important; }
  .premium-frame-rainbow { box-shadow:0 0 30px rgba(255,0,0,.2),0 0 50px rgba(0,255,0,.2),0 0 70px rgba(0,0,255,.2) !important; border:3px solid transparent !important; background-image:linear-gradient(white,white),linear-gradient(to right,red,orange,yellow,green,blue,purple) !important; background-origin:padding-box,border-box !important; background-clip:padding-box,border-box !important; }
  .premium-frame-gold { box-shadow:0 0 40px rgba(245,158,11,.5) !important; border:3px solid #f59e0b !important; }
  .premium-frame-cyan { box-shadow:0 0 40px rgba(6,182,212,.5) !important; border:3px solid #06b6d4 !important; }
  .premium-frame-pink { box-shadow:0 0 40px rgba(236,72,153,.5) !important; border:3px solid #ec4899 !important; }
  .premium-frame-purple { box-shadow:0 0 40px rgba(168,85,247,.5) !important; border:3px solid #a855f7 !important; }
  .premium-frame-emerald { box-shadow:0 0 40px rgba(16,185,129,.5) !important; border:3px solid #10b981 !important; }
  .premium-frame-almond { box-shadow:0 0 40px rgba(212,163,115,.5) !important; border:3px solid #d4a373 !important; }
  .premium-frame-royal { box-shadow:0 0 40px rgba(139,92,246,.5) !important; border:3px solid #8b5cf6 !important; }
  .premium-frame-cherry { box-shadow:0 0 40px rgba(239,68,68,.5) !important; border:3px solid #ef4444 !important; }

  .premium-font-elegant { font-family: Georgia, serif !important; }
  .premium-font-modern { font-family: 'Helvetica Neue', sans-serif !important; }
  .premium-font-bold { font-family: Impact, sans-serif !important; letter-spacing: .5px !important; }
  .premium-font-cursive { font-family: 'Brush Script MT', cursive !important; }
  .premium-font-mono { font-family: 'Courier New', monospace !important; }
  .premium-font-neon { font-family: 'Arial Black', sans-serif !important; text-shadow: 0 0 10px rgba(6,182,212,.5) !important; }
  .premium-font-soft { font-family: 'Segoe UI', sans-serif !important; font-weight: 300 !important; }
  .premium-font-luxury { font-family: 'Times New Roman', serif !important; font-style: italic !important; }
  .premium-font-futuristic { font-family: Arial, sans-serif !important; letter-spacing: 2px !important; text-transform: uppercase !important; }

  .premium-profile-glow { animation: premiumGlow 3s ease-in-out infinite; position: relative; }
  @keyframes premiumGlow {
    0%,100% { box-shadow: 0 0 30px rgba(124,58,237,.3), 0 0 60px rgba(124,58,237,.1); }
    50% { box-shadow: 0 0 50px rgba(124,58,237,.5), 0 0 100px rgba(124,58,237,.2); }
  }
  .premium-profile-glow.gold::before,
  .premium-profile-glow.cyan::before,
  .premium-profile-glow.pink::before,
  .premium-profile-glow.purple::before,
  .premium-profile-glow.emerald::before,
  .premium-profile-glow.orange::before,
  .premium-profile-glow.almond::before,
  .premium-profile-glow.royal::before,
  .premium-profile-glow.cherry::before {
    content:''; position:absolute; inset:-4px; border-radius:16px; z-index:-1; filter: blur(8px); opacity:.6;
  }
  .premium-profile-glow.gold::before { background: linear-gradient(45deg,#f59e0b,#fbbf24,#f59e0b); }
  .premium-profile-glow.cyan::before { background: linear-gradient(45deg,#06b6d4,#22d3ee,#06b6d4); }
  .premium-profile-glow.pink::before { background: linear-gradient(45deg,#ec4899,#f472b6,#ec4899); }
  .premium-profile-glow.purple::before { background: linear-gradient(45deg,#7c3aed,#a78bfa,#7c3aed); }
  .premium-profile-glow.emerald::before { background: linear-gradient(45deg,#10b981,#34d399,#10b981); }
  .premium-profile-glow.orange::before { background: linear-gradient(45deg,#f97316,#fb923c,#f97316); }
  .premium-profile-glow.almond::before { background: linear-gradient(45deg,#d4a373,#e9c9a0,#d4a373); }
  .premium-profile-glow.royal::before { background: linear-gradient(45deg,#8b5cf6,#a78bfa,#8b5cf6); }
  .premium-profile-glow.cherry::before { background: linear-gradient(45deg,#ef4444,#f87171,#ef4444); }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-24 relative">
  <header class="px-4 py-4 bg-darkcard border-b border-slate-900 flex items-center gap-3">
    <button id="back-btn" class="p-2 bg-slate-800/50 rounded-full border border-slate-700 hover:bg-slate-700 transition">
      <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h1 id="page-title" class="text-sm font-black uppercase tracking-widest text-slate-300">Profile</h1>
  </header>

  <main class="px-4 py-4 space-y-4">
    <!-- Loading skeleton -->
    <div id="loading" class="space-y-4">
      <div class="skeleton h-44"></div>
      <div class="skeleton h-12"></div>
      <div class="skeleton h-24"></div>
    </div>

    <!-- Content -->
    <div id="content" class="hidden space-y-4">
      <div id="premium-banner" class="hidden bg-gradient-to-r from-blue-700 to-indigo-800 rounded-2xl p-4 cursor-pointer border border-blue-600 shadow-xl">
        <h4 class="text-sm font-bold text-slate-100">Deploy Premium Matrix Framework</h4>
        <p class="text-[11px] text-blue-200 mt-0.5">Unlock soft design canvases and verified identification tokens.</p>
      </div>

      <div id="profile-card" class="bg-darkcard p-5 rounded-2xl border border-slate-800 relative transition-all duration-300">
        <!-- Owner-only Settings icon (top-right) -->
        <a id="settings-icon-btn" href="settings.html"
           class="hidden absolute top-4 right-4 p-2 rounded-full bg-slate-900/80 hover:bg-slate-800 border border-cyan-500/30 hover:border-cyan-500/60 transition shadow-lg shadow-cyan-500/10"
           title="Settings" aria-label="Open Settings">
          <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </a>

        <div class="flex flex-col items-center text-center">
          <div id="avatar-frame" class="w-20 h-20 rounded-full p-0.5 border border-slate-700 mb-3 overflow-hidden">
            <img id="avatar" src="" class="w-full h-full object-cover rounded-full" alt="Avatar">
          </div>
          <h3 id="name" class="text-base font-bold text-slate-100"></h3>
          <p id="uid" class="text-xs text-slate-500 font-mono mt-0.5"></p>
          <span id="profession" class="text-[10px] font-semibold uppercase tracking-wider bg-slate-800 text-slate-400 px-2.5 py-0.5 rounded-full mt-2 border border-slate-700 hidden"></span>
          <p id="bio" class="text-xs text-slate-400 mt-3 max-w-xs leading-relaxed"></p>
        </div>

        <!-- Peer actions (only shows on other users' profiles) -->
        <div id="peer-actions" class="hidden w-full mt-4 pt-4 border-t border-slate-800 space-y-2">
          <button id="friend-action-btn" class="w-full py-2 rounded-xl text-xs font-bold transition"></button>
          <button id="chat-action-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold transition">Open Chat</button>
        </div>
      </div>

      <!-- Tabs -->
      <div id="tabs" class="flex bg-darkcard p-1 rounded-xl border border-slate-800/60 text-xs">

        <button data-tab="reels" class="tab-btn flex-1 py-2 rounded-lg font-bold">Reels</button>

      <p class="text-xs mt-1">The user may have deleted their account.</p>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkcard/95 backdrop-blur-md border-t border-slate-900 h-16 flex justify-around items-center z-40">
    <a href="main.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="chat.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </a>
    <a href="reels.html" class="text-slate-500 hover:text-pink-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </a>
    <a href="search.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </a>

      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z"/></svg>

</div>

<div id="img-viewer" class="hidden fixed inset-0 bg-black/95 z-[90] flex flex-col items-center justify-center p-4">
  <button id="close-viewer" class="absolute top-4 right-4 text-white bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Close</button>
  <img id="viewer-img" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl">
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  let ME = null;
  let TARGET = null;
  let IS_OWNER = false;
  let ALL_POSTS = [];
  let ALL_REELS = [];
  let FRIENDSHIPS = {};
  let unsubPosts = null, unsubReels = null, unsubFriends = null;

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else window.location.href = 'main.html';
  });
  document.getElementById('close-viewer').addEventListener('click', () => {
    document.getElementById('img-viewer').classList.add('hidden');
  });

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const t = btn.dataset.tab;
      document.getElementById('view-posts').classList.toggle('hidden', t !== 'posts');
      document.getElementById('view-reels').classList.toggle('hidden', t !== 'reels');
    });
  });

  // Auth gate
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    for (const k of Object.keys(users)) {
      if (users[k] && users[k].realFirebaseUID === user.uid) { ME = users[k]; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    const params = new URLSearchParams(window.location.search);
    const targetUid = params.get('uid');
    IS_OWNER = !targetUid || targetUid === ME.uid;

    if (IS_OWNER) {
      TARGET = ME;
    } else {
      for (const k of Object.keys(users)) {
        if (users[k] && users[k].uid === targetUid) { TARGET = users[k]; break; }
      }
      if (!TARGET) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('not-found').classList.remove('hidden');
        return;
      }
    }

    document.getElementById('page-title').textContent = IS_OWNER ? 'My Profile' : TARGET.name;
    renderProfile();
    applyPremiumToCard(TARGET);

    // Posts for this profile
    const unsubPostsFn = onValue(ref(db, 'publications'), (snap) => {
      const data = snap.val() || {};
      ALL_POSTS = Object.keys(data)
        .map(k => data[k])
        .filter(p => p && p.authorUID === TARGET.uid)
        .sort((a,b) => b.timestamp - a.timestamp);
      renderPosts();
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
    });
    unsubPosts = unsubPostsFn;

    // Reels for this profile
    const unsubReelsFn = onValue(ref(db, 'reels'), (snap) => {
      const data = snap.val() || {};
      ALL_REELS = Object.keys(data)
        .map(k => data[k])
        .filter(r => r && r.userId === TARGET.uid)
        .sort((a,b) => b.createdAt - a.createdAt);
      renderReels();
    });
    unsubReels = unsubReelsFn;

    // Friendship state (only for peers)
    if (!IS_OWNER) {
      const unsubFriendsFn = onValue(ref(db, 'friendships'), (snap) => {
        FRIENDSHIPS = snap.val() || {};
        renderPeerActions();
      });
      unsubFriends = unsubFriendsFn;
    }
  });

  function renderProfile() {
    document.getElementById('avatar').src = TARGET.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
    document.getElementById('name').textContent = TARGET.name;
    document.getElementById('uid').textContent = '@' + TARGET.uid;
    document.getElementById('bio').textContent = TARGET.bio || 'No bio yet.';

    const prof = document.getElementById('profession');
    if (TARGET.profession) {
      prof.textContent = TARGET.profession;
      prof.classList.remove('hidden');
    } else prof.classList.add('hidden');

    if (IS_OWNER) {
      // Show the settings gear icon in the top-right of the profile card
      document.getElementById('settings-icon-btn').classList.remove('hidden');
      document.getElementById('peer-actions').classList.add('hidden');

      if (!ME.isPremium) {
        const banner = document.getElementById('premium-banner');
        banner.classList.remove('hidden');
        // avoid attaching the same listener multiple times
        banner.onclick = () => {
          window.location.href = 'settings.html#premium';
        };
      }
    } else {
      document.getElementById('settings-icon-btn').classList.add('hidden');
      document.getElementById('peer-actions').classList.remove('hidden');
    }
  }

  function applyPremiumToCard(user) {
    const card = document.getElementById('profile-card');
    const frame = document.getElementById('avatar-frame');
    const name = document.getElementById('name');
    const bio = document.getElementById('bio');

    // Reset
    [card, frame, name, bio].forEach(el => {
      if (!el) return;
      el.className = el.className.split(' ')
        .filter(c => !c.startsWith('premium-theme-') && !c.startsWith('premium-frame-') && !c.startsWith('premium-font-') && !c.startsWith('premium-profile-glow'))
        .join(' ');
    });
    card.className = 'bg-darkcard p-5 rounded-2xl border border-slate-800 relative transition-all duration-300';
    frame.className = 'w-20 h-20 rounded-full p-0.5 border border-slate-700 mb-3 overflow-hidden';

    if (user.isPremium && user.premiumTheme) card.classList.add(user.premiumTheme);
    if (user.isPremium && user.premiumFrame) frame.classList.add(user.premiumFrame);
    if (user.isPremium && user.premiumFont) {
      name.classList.add(user.premiumFont);
      bio.classList.add(user.premiumFont);
    }
    if (user.isPremium) {
      const glowMap = { galaxy:'purple', sunset:'orange', ocean:'cyan', forest:'emerald', rose:'pink', gold:'gold', ice:'cyan', almond:'almond', royal:'royal', cherry:'cherry' };
      const themeKey = (user.premiumTheme || '').replace('premium-theme-','');
      card.classList.add('premium-profile-glow', glowMap[themeKey] || 'purple');
    }
  }

  function renderPeerActions() {
    const btn = document.getElementById('friend-action-btn');
    const chatBtn = document.getElementById('chat-action-btn');
    const isFriend = FRIENDSHIPS[`bond_${ME.uid}_and_${TARGET.uid}`] === 'confirmed';
    const sent = FRIENDSHIPS[`req_${ME.uid}_to_${TARGET.uid}`] === 'pending';
    const incoming = FRIENDSHIPS[`req_${TARGET.uid}_to_${ME.uid}`] === 'pending';

    btn.onclick = null;
    btn.className = 'w-full py-2 rounded-xl text-xs font-bold transition';

    if (isFriend) {
      btn.textContent = 'Verified Network';
      btn.classList.add('bg-slate-800','text-cyan-400');
      btn.disabled = true;
      chatBtn.classList.remove('hidden');
      chatBtn.onclick = () => window.location.href = 'chat.html?uid=' + encodeURIComponent(TARGET.uid);
    } else if (sent) {
      btn.textContent = 'Request Sent';
      btn.classList.add('bg-slate-800','text-slate-500');
      btn.disabled = true;
      chatBtn.classList.add('hidden');
    } else if (incoming) {
      btn.textContent = 'Accept Request';
      btn.classList.add('bg-emerald-600','text-white');
      btn.disabled = false;
      chatBtn.classList.add('hidden');
      btn.onclick = async () => {
        const updates = {};
        updates[`friendships/req_${TARGET.uid}_to_${ME.uid}`] = null;
        updates[`friendships/bond_${ME.uid}_and_${TARGET.uid}`] = 'confirmed';
        updates[`friendships/bond_${TARGET.uid}_and_${ME.uid}`] = 'confirmed';
        await update(ref(db), updates);
        toast('Connected', 'Friend request accepted');
      };
    } else {
      btn.textContent = 'Send Friend Request';
      btn.classList.add('bg-blue-600','text-white');
      btn.disabled = false;
      chatBtn.classList.add('hidden');
      btn.onclick = async () => {
        await set(ref(db, `friendships/req_${ME.uid}_to_${TARGET.uid}`), 'pending');
        toast('Request Sent', 'Friend request sent');
      };
    }
  }

  function renderPosts() {
    const c = document.getElementById('view-posts');
    c.innerHTML = '';
    if (!ALL_POSTS.length) {
      c.innerHTML = `<p class="text-[11px] text-slate-600 text-center py-6">No posts yet.</p>`;
      return;
    }
    const fontClass = TARGET.isPremium && TARGET.premiumFont ? TARGET.premiumFont : '';
    ALL_POSTS.forEach(post => {
      const el = document.createElement('div');
      el.className = 'bg-darkcard border border-slate-800 p-3 rounded-xl space-y-2 text-xs';
      el.innerHTML = `
        ${post.text ? `<p class="text-slate-300 ${fontClass}">${post.text}</p>` : ''}
        ${post.image ? `<div class="rounded-lg overflow-hidden max-h-48 cursor-pointer" data-img><img src="${post.image}" class="w-full h-full object-cover" loading="lazy"></div>` : ''}
        <p class="text-[9px] text-slate-600 font-mono">${new Date(post.timestamp).toLocaleString()}</p>
      `;
      if (post.image) {
        el.querySelector('[data-img]').addEventListener('click', () => {
          document.getElementById('viewer-img').src = post.image;
          document.getElementById('img-viewer').classList.remove('hidden');
        });
      }
      c.appendChild(el);
    });
  }

  function renderReels() {
    const c = document.getElementById('view-reels');
    c.innerHTML = '';
    if (!ALL_REELS.length) {
      c.innerHTML = `<p class="text-[11px] text-slate-600 text-center py-6">No reels yet.</p>`;
      return;
    }
    ALL_REELS.forEach(r => {
      const el = document.createElement('div');
      el.className = 'bg-darkcard border border-slate-800 p-3 rounded-xl space-y-2 text-xs';
      el.innerHTML = `
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span class="text-slate-300">${r.caption || 'Reel'}</span>
        </div>
        <video src="${r.videoUrl}" muted playsinline preload="none" controls class="rounded-lg w-full max-h-56 object-cover"></video>
        <div class="flex gap-3 text-[10px] text-slate-500">
          <span>${r.likes ? Object.keys(r.likes).length : 0} likes</span>
          <span>${r.comments ? Object.keys(r.comments).length : 0} comments</span>
          <span>${r.views || 0} views</span>
        </div>
      `;
      c.appendChild(el);
    });
  }

  window.addEventListener('beforeunload', () => {
    if (unsubPosts) unsubPosts();
    if (unsubReels) unsubReels();
    if (unsubFriends) unsubFriends();
  });
</script>
</body>
</html>
