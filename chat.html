<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-700 { background:#d0d0d8 !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .bg-slate-900\/50 { background:rgba(245,245,248,.5) !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .hover\:bg-slate-100:hover { background:#f0f0f5 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.light-mode .bg-blue-950\/30 { background:rgba(37,99,235,.08) !important; }
  body.light-mode .border-blue-600\/50 { border-color:rgba(37,99,235,.25) !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .hidden { display:none !important; }
  .custom-scrollbar::-webkit-scrollbar { width:4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background:#334155; border-radius:10px; }
  body.light-mode .custom-scrollbar::-webkit-scrollbar-thumb { background:#c0c0cc; }
  .spinner { border:2px solid rgba(255,255,255,.15); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
  .shared-media-preview { max-width:200px; border-radius:12px; overflow:hidden; border:1px solid #334155; cursor:pointer; transition: transform .2s; }
  .shared-media-preview:hover { transform:scale(1.02); }
  .shared-media-preview img, .shared-media-preview video { width:100%; height:auto; max-height:150px; object-fit:cover; }
  .shared-media-preview .media-label { padding:4px 8px; font-size:9px; text-align:center; background:#0f172a; color:#94a3b8; }
  body.light-mode .shared-media-preview { border-color:#d0d2d6; }
  body.light-mode .shared-media-preview .media-label { background:#f5f5f8; color:#6b6b8a; }
  .msg-bubble { max-width:75%; padding:10px 12px; border-radius:16px; font-size:12px; position:relative; word-break:break-word; }
  .msg-me { background:#2563eb; color:#fff; align-self:flex-end; border-top-right-radius:4px; }
  .msg-them { background:#1e293b; color:#e2e8f0; align-self:flex-start; border-top-left-radius:4px; border:1px solid #334155; }
  body.light-mode .msg-them { background:#e8e8ee; color:#1a1a2e; border-color:#d0d2d6; }
  .msg-meta { font-size:8px; text-align:right; margin-top:4px; opacity:.75; font-family: 'Courier New', monospace; }
  .ctx-panel { position:absolute; left:16px; right:16px; bottom:70px; background:#1e293b; border:1px solid #334155; padding:12px; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.6); z-index:50; }
  body.light-mode .ctx-panel { background:#ffffff; border-color:#e4e6eb; }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div id="root" class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-24 relative">

  <!-- ================= CHAT LIST VIEW ================= -->
  <section id="view-list">
    <header class="px-4 py-4 bg-darkcard border-b border-slate-900">
      <div class="flex justify-between items-center">
        <h1 class="text-sm font-black uppercase tracking-widest text-slate-300">Handshake Channels</h1>
        <div class="relative">
          <button id="chat-menu-btn" class="text-slate-400 p-2 bg-darkcard border border-slate-800 rounded-xl hover:bg-slate-800 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01"/></svg>
          </button>
          <div id="chat-menu" class="hidden absolute right-0 mt-2 w-48 bg-darkcard border border-slate-800 rounded-xl shadow-2xl z-50 text-xs">
            <button id="open-group" class="w-full text-left px-4 py-3 hover:bg-slate-800 transition text-cyan-400 font-bold">Create Group Chat</button>
          </div>
        </div>
      </div>
    </header>

    <main class="px-4 py-4 space-y-4">
      <!-- Requests -->
      <div>
        <h4 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 pl-1 flex justify-between items-center">
          <span>Verification Requests</span>
          <span id="req-badge" class="bg-red-500 text-white font-bold rounded-full text-[10px] px-2 py-0.5 hidden">0</span>
        </h4>
        <div id="requests-list" class="space-y-2"></div>
      </div>

      <!-- Active chats -->
      <div>
        <h4 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 pl-1">Active Communications</h4>
        <div id="active-list" class="space-y-2"></div>
      </div>
    </main>
  </section>

  <!-- ================= ACTIVE THREAD VIEW ================= -->
  <section id="view-thread" class="hidden fixed inset-0 bg-darkbg max-w-md mx-auto w-full h-full flex flex-col z-40">
    <header class="p-4 bg-darkcard border-b border-slate-900 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" id="thread-peer-link">
        <button id="back-to-list" class="p-1.5 bg-slate-800 border border-slate-700 rounded-lg">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <img id="thread-avatar" src="" class="w-8 h-8 rounded-full border border-slate-700 object-cover">
        <div>
          <h3 id="thread-name" class="text-xs font-bold text-slate-200">Loading...</h3>
          <p id="thread-uid" class="text-[9px] text-slate-500 font-mono"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="voice-call-btn" class="hidden p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition" title="Voice call">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        </button>
        <button id="close-thread" class="text-slate-400 bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700">Close</button>
      </div>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar flex flex-col relative"></div>

    <div id="ctx-panel" class="hidden ctx-panel">
      <div class="flex justify-around items-center mb-2.5 border-b border-slate-800 pb-2">
        <button data-react="🔥" class="text-base hover:scale-125 transition">🔥</button>
        <button data-react="👍" class="text-base hover:scale-125 transition">👍</button>
        <button data-react="❤️" class="text-base hover:scale-125 transition">❤️</button>
        <button data-react="😂" class="text-base hover:scale-125 transition">😂</button>
      </div>
      <div class="flex gap-2">
        <button id="copy-msg" class="flex-1 bg-slate-800 text-slate-300 py-1.5 rounded-xl text-[10px] font-bold">Copy</button>
        <button id="dismiss-ctx" class="bg-slate-700 text-slate-400 px-3 py-1.5 rounded-xl text-[10px] font-bold">Dismiss</button>
      </div>
    </div>

    <footer class="p-3 bg-darkcard border-t border-slate-900 flex items-center gap-2">
      <input type="text" id="msg-input" placeholder="Formulate message packet..."
        class="flex-1 bg-darkbg border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none text-slate-200">
      <button id="send-msg" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl text-xs font-bold text-white">Send</button>
    </footer>
  </section>

  <!-- Bottom nav -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkcard/95 backdrop-blur-md border-t border-slate-900 h-16 flex justify-around items-center z-30">
    <a href="main.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="chat.html" class="text-cyan-400 flex flex-col items-center flex-1 py-1 relative">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span id="nav-badge" class="absolute -top-0.5 right-1 bg-red-500 text-white font-mono text-[9px] font-bold rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
    </a>
    <a href="reels.html" class="text-slate-500 hover:text-pink-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </a>
    <a href="search.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </a>
    <a href="profile.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z"/></svg>
    </a>
  </nav>
</div>

<!-- GROUP MODAL -->
<div id="group-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-darkcard w-full max-w-sm rounded-3xl border border-slate-800 p-5 flex flex-col max-h-[75vh]">
    <div class="flex justify-between items-center pb-3 border-b border-slate-800">
      <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Deploy Shared Channel</span>
      <button id="close-group" class="text-slate-500 hover:text-white text-xs font-bold">Close</button>
    </div>
    <div class="mt-3 space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-1">
      <input type="text" id="group-name" placeholder="Enter Group identity tag..."
        class="w-full px-3 py-2 bg-darkbg border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none">
      <h4 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 pl-1 mt-2">Select Participants</h4>
      <div id="group-grid" class="space-y-2"></div>
    </div>
    <button id="create-group" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 py-2.5 rounded-xl text-xs font-black text-white mt-4 shadow-xl">Initialize Multiplex Session</button>
  </div>
</div>

<!-- MEDIA VIEWER -->
<div id="media-viewer" class="hidden fixed inset-0 bg-black/95 z-[90] flex flex-col items-center justify-center p-4">
  <button id="close-media" class="absolute top-4 right-4 text-white bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Close</button>
  <img id="viewer-img" src="" class="hidden max-w-full max-h-[80vh] object-contain rounded-xl">
  <video id="viewer-video" src="" controls class="hidden max-w-full max-h-[80vh] rounded-xl"></video>
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, push, update, remove, onValue, off } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  let ME = null;
  let PEERS = [];                    // all users
  let FRIENDSHIPS = {};
  let CHATS = {};                    // all chat threads (only when needed)
  let TARGET_UID = null;             // active chat peer
  let msgListenerUnsub = null;
  let friendshipsUnsub = null;
  let chatsUnsub = null;             // global chat thread index — required for unread counts
  let ctxMsgRef = null;

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  // ---- Auth + initial load ----
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    const usersSnap = await get(ref(db, 'users'));
    const usersData = usersSnap.val() || {};
    PEERS = Object.keys(usersData).map(k => usersData[k]).filter(u => u && u.uid);
    for (const u of PEERS) {
      if (u.realFirebaseUID === user.uid) { ME = u; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    // Live friendships (small)
    const fUnsub = onValue(ref(db, 'friendships'), (snap) => {
      FRIENDSHIPS = snap.val() || {};
      renderRequests();
      renderActiveChats();
    });
    friendshipsUnsub = fUnsub;

    // Live chat threads index (needed for unread badge + last-message preview)
    const cUnsub = onValue(ref(db, 'chats'), (snap) => {
      CHATS = snap.val() || {};
      renderActiveChats();
      updateNavBadge();
      if (TARGET_UID) renderMessages();
    });
    chatsUnsub = cUnsub;

    // Deep-link: chat.html?uid=XXXX
    const params = new URLSearchParams(window.location.search);
    const deepUid = params.get('uid');
    if (deepUid) {
      openThread(deepUid);
    }
  });

  // ---- Menu ----
  document.getElementById('chat-menu-btn').addEventListener('click', () => {
    document.getElementById('chat-menu').classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#chat-menu') && !e.target.closest('#chat-menu-btn')) {
      document.getElementById('chat-menu').classList.add('hidden');
    }
  });
  document.getElementById('open-group').addEventListener('click', () => {
    document.getElementById('chat-menu').classList.add('hidden');
    openGroupModal();
  });

  // ---- Requests ----
  function renderRequests() {
    const c = document.getElementById('requests-list');
    c.innerHTML = '';
    let pending = 0;
    Object.keys(FRIENDSHIPS).forEach(key => {
      if (key.startsWith('req_') && key.endsWith('_to_' + ME.uid) && FRIENDSHIPS[key] === 'pending') {
        const senderUID = key.split('_')[1];
        const sender = PEERS.find(p => p.uid === senderUID);
        if (!sender) return;
        pending++;
        const row = document.createElement('div');
        row.className = 'bg-darkcard p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs';
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${sender.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-8 h-8 rounded-full object-cover">
            <div>
              <p class="font-bold text-slate-200">${sender.name}</p>
              <p class="text-[10px] text-slate-500 font-mono">@${sender.uid}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button data-op="accept" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white p-2 rounded-lg border border-emerald-500/30 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </button>
            <button data-op="deny" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white p-2 rounded-lg border border-red-500/30 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        `;
        row.querySelector('[data-op="accept"]').addEventListener('click', () => handleRequest(senderUID, 'accept'));
        row.querySelector('[data-op="deny"]').addEventListener('click', () => handleRequest(senderUID, 'deny'));
        c.appendChild(row);
      }
    });
    const badge = document.getElementById('req-badge');
    if (pending > 0) { badge.textContent = pending; badge.classList.remove('hidden'); }
    else { badge.classList.add('hidden'); }
    if (!pending) c.innerHTML = `<p class="text-[11px] text-slate-600 text-center py-2">No pending verification packets detected.</p>`;
  }

  async function handleRequest(senderUID, decision) {
    const myUID = ME.uid;
    const reqKey = `req_${senderUID}_to_${myUID}`;
    if (decision === 'accept') {
      const updates = {};
      updates[`friendships/${reqKey}`] = null;
      updates[`friendships/bond_${myUID}_and_${senderUID}`] = 'confirmed';
      updates[`friendships/bond_${senderUID}_and_${myUID}`] = 'confirmed';
      await update(ref(db), updates);
      toast('Connected', 'Friend request accepted');
    } else {
      await set(ref(db, `friendships/${reqKey}`), null);
      toast('Declined', 'Friend request denied');
    }
  }

  // ---- Active chats ----
  function renderActiveChats() {
    const c = document.getElementById('active-list');
    c.innerHTML = '';
    if (!ME) return;
    const myUID = ME.uid;
    const list = [];

    PEERS.forEach(peer => {
      if (peer.uid === myUID) return;
      if (FRIENDSHIPS[`bond_${myUID}_and_${peer.uid}`] !== 'confirmed') return;
      const threadKey = myUID < peer.uid ? `${myUID}_text_${peer.uid}` : `${peer.uid}_text_${myUID}`;
      const msgs = CHATS[threadKey];
      let unseen = 0, lastTs = 0, lastText = '';
      if (msgs) {
        const arr = Object.values(msgs);
        arr.forEach(m => {
          if (m.sender !== myUID && m.status !== 'seen') unseen++;
          if (m.timestamp > lastTs) { lastTs = m.timestamp; lastText = m.text || ''; }
        });
      }
      list.push({ peer, unseen, lastTs, lastText, threadKey });
    });

    list.sort((a,b) => b.lastTs - a.lastTs);

    if (!list.length) {
      c.innerHTML = `<p class="text-[11px] text-slate-600 text-center py-4">Establish peer network handshakes to deploy channels.</p>`;
      return;
    }

    list.forEach(({ peer, unseen, lastText }) => {
      const row = document.createElement('div');
      row.className = `p-3 rounded-xl border flex justify-between items-center transition cursor-pointer ${unseen > 0 ? 'bg-blue-950/30 border-blue-600/50 shadow-md' : 'bg-darkcard border-slate-800 hover:bg-slate-800/70'}`;
      row.innerHTML = `
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <img src="${peer.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-9 h-9 rounded-full object-cover border border-slate-700 flex-shrink-0">
          <div class="min-w-0 flex-1">
            <p class="font-bold flex items-center gap-1.5 ${unseen > 0 ? 'text-blue-400' : 'text-slate-200'}">
              <span class="truncate">${peer.name}</span>
              ${unseen > 0 ? '<span class="h-2 w-2 bg-blue-500 rounded-full animate-pulse flex-shrink-0"></span>' : ''}
            </p>
            <p class="text-[10px] text-slate-500 truncate">${lastText || 'No messages yet'}</p>
          </div>
        </div>
        ${unseen > 0 ? `<span class="bg-blue-600 text-white text-[10px] font-bold rounded-full h-5 px-2 flex items-center justify-center flex-shrink-0 ml-2">${unseen}</span>` : ''}
      `;
      row.addEventListener('click', () => openThread(peer.uid));
      c.appendChild(row);
    });
  }

  function updateNavBadge() {
    if (!ME) return;
    let total = 0;
    Object.keys(CHATS).forEach(key => {
      if (key.includes(ME.uid)) {
        Object.values(CHATS[key]).forEach(m => {
          if (m.sender !== ME.uid && m.status !== 'seen') total++;
        });
      }
    });
    const b = document.getElementById('nav-badge');
    if (total > 0) { b.textContent = total > 9 ? '9+' : total; b.classList.remove('hidden'); }
    else b.classList.add('hidden');
  }

  // ---- Open thread ----
  function openThread(peerUID) {
    const peer = PEERS.find(p => p.uid === peerUID);
    if (!peer) return toast('Error', 'Peer not found');

    TARGET_UID = peerUID;
    document.getElementById('thread-avatar').src = peer.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
    document.getElementById('thread-name').textContent = peer.name;
    document.getElementById('thread-uid').textContent = '@' + peer.uid;
    document.getElementById('thread-peer-link').onclick = () => {
      window.location.href = 'profile.html?uid=' + encodeURIComponent(peer.uid);
    };

    // Voice button (functional only if PeerJS loaded — will be added in Reels/Call batch.
    // For now, hide to avoid dead buttons.)
    document.getElementById('voice-call-btn').classList.add('hidden');

    document.getElementById('view-list').classList.add('hidden');
    document.getElementById('view-thread').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.add('hidden');

    // Mark incoming messages as seen
    const myUID = ME.uid;
    const threadKey = myUID < peerUID ? `${myUID}_text_${peerUID}` : `${peerUID}_text_${myUID}`;
    const msgs = CHATS[threadKey];
    if (msgs) {
      Object.keys(msgs).forEach(id => {
        if (msgs[id].sender !== myUID && msgs[id].status !== 'seen') {
          update(ref(db, `chats/${threadKey}/${id}`), { status: 'seen' });
        }
      });
    }

    // The global `chats` listener already covers this thread — no extra listener needed.
    renderMessages();
    document.getElementById('msg-input').focus();
  }

  function closeThread() {
    TARGET_UID = null;
    document.getElementById('view-thread').classList.add('hidden');
    document.getElementById('view-list').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.getElementById('messages').innerHTML = '';
    document.getElementById('ctx-panel').classList.add('hidden');
    ctxMsgRef = null;
  }

  document.getElementById('back-to-list').addEventListener('click', closeThread);
  document.getElementById('close-thread').addEventListener('click', closeThread);

  // ---- Render messages ----
  function renderMessages() {
    if (!TARGET_UID || !ME) return;
    const myUID = ME.uid;
    const threadKey = myUID < TARGET_UID ? `${myUID}_text_${TARGET_UID}` : `${TARGET_UID}_text_${myUID}`;
    const msgs = CHATS[threadKey];

    const box = document.getElementById('messages');
    box.innerHTML = '';

    if (!msgs) {
      box.innerHTML = `<div class="text-center text-slate-600 text-[10px] my-auto">Channel structural pipeline is empty. Send the first message.</div>`;
      return;
    }

    const ordered = Object.keys(msgs).map(k => ({ id: k, ...msgs[k] })).sort((a,b) => a.timestamp - b.timestamp);

    ordered.forEach(m => {
      const isMe = m.sender === myUID;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMe ? 'msg-me' : 'msg-them');

      let media = '';
      if (m.mediaType === 'reel' && m.mediaUrl) {
        media = `<div class="mt-2 shared-media-preview" data-media="video" data-src="${m.mediaUrl}">
          <video src="${m.mediaUrl}" muted playsinline preload="metadata" style="max-height:120px;width:100%;object-fit:cover;"></video>
          <div class="media-label">Reel</div></div>`;
      } else if (m.mediaType === 'post' && m.mediaUrl) {
        media = `<div class="mt-2 shared-media-preview" data-media="image" data-src="${m.mediaUrl}">
          <img src="${m.mediaUrl}" style="max-height:120px;width:100%;object-fit:cover;"/>
          <div class="media-label">Post</div></div>`;
      }

      let reactions = '';
      if (m.reactions) {
        const arr = Object.values(m.reactions);
        if (arr.length) {
          reactions = `<div class="absolute -bottom-2 right-2 bg-slate-800 border border-slate-700 rounded-full px-1.5 py-0.5 text-[9px] flex items-center gap-0.5 shadow-lg">${arr.map(r => `<span>${r}</span>`).join('')}</div>`;
        }
      }

      bubble.innerHTML = `
        <p class="leading-relaxed pr-2">${escapeHtml(m.text || '')}</p>
        ${media}
        <span class="msg-meta">${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
        ${reactions}
      `;

      // Context menu (right-click / long-press)
      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        ctxMsgRef = { thread: threadKey, id: m.id, text: m.text || '' };
        document.getElementById('ctx-panel').classList.remove('hidden');
      });
      let lpTO = null;
      bubble.addEventListener('touchstart', () => {
        lpTO = setTimeout(() => {
          ctxMsgRef = { thread: threadKey, id: m.id, text: m.text || '' };
          document.getElementById('ctx-panel').classList.remove('hidden');
        }, 550);
      });
      bubble.addEventListener('touchend', () => clearTimeout(lpTO));
      bubble.addEventListener('touchmove', () => clearTimeout(lpTO));

      // Media click
      bubble.querySelectorAll('[data-media]').forEach(el => {
        el.addEventListener('click', () => {
          const type = el.dataset.media;
          const src = el.dataset.src;
          openMedia(src, type);
        });
      });

      box.appendChild(bubble);
    });

    setTimeout(() => { box.scrollTop = box.scrollHeight; }, 30);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Send message ----
  document.getElementById('send-msg').addEventListener('click', sendMsg);
  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMsg();
  });

  async function sendMsg() {
    if (!TARGET_UID || !ME) return;
    const input = document.getElementById('msg-input');
    const txt = input.value.trim();
    if (!txt) return;
    const myUID = ME.uid;
    const threadKey = myUID < TARGET_UID ? `${myUID}_text_${TARGET_UID}` : `${TARGET_UID}_text_${myUID}`;
    await push(ref(db, `chats/${threadKey}`), {
      sender: myUID,
      text: txt,
      timestamp: Date.now(),
      status: 'transmitted'
    });
    input.value = '';
  }

  // ---- Context panel ----
  document.getElementById('dismiss-ctx').addEventListener('click', () => {
    document.getElementById('ctx-panel').classList.add('hidden');
    ctxMsgRef = null;
  });
  document.getElementById('copy-msg').addEventListener('click', () => {
    if (!ctxMsgRef) return;
    navigator.clipboard.writeText(ctxMsgRef.text).then(() => {
      toast('Copied', 'Message copied');
      document.getElementById('ctx-panel').classList.add('hidden');
      ctxMsgRef = null;
    });
  });
  document.querySelectorAll('[data-react]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!ctxMsgRef) return;
      await push(ref(db, `chats/${ctxMsgRef.thread}/${ctxMsgRef.id}/reactions`), btn.dataset.react);
      document.getElementById('ctx-panel').classList.add('hidden');
      ctxMsgRef = null;
    });
  });

  // ---- Media viewer ----
  function openMedia(src, type) {
    const v = document.getElementById('media-viewer');
    const img = document.getElementById('viewer-img');
    const vid = document.getElementById('viewer-video');
    img.classList.add('hidden'); vid.classList.add('hidden');
    if (type === 'image') { img.src = src; img.classList.remove('hidden'); }
    else { vid.src = src; vid.classList.remove('hidden'); }
    v.classList.remove('hidden');
  }
  document.getElementById('close-media').addEventListener('click', () => {
    document.getElementById('media-viewer').classList.add('hidden');
    document.getElementById('viewer-video').pause();
    document.getElementById('viewer-video').src = '';
  });

  // ---- Group modal (same behavior as original: creates a local announcement toast;
  //      DB structure unchanged — full group thread feature not previously persisted) ----
  function openGroupModal() {
    const c = document.getElementById('group-grid');
    c.innerHTML = '';
    let count = 0;
    PEERS.forEach(peer => {
      if (peer.uid === ME.uid) return;
      if (FRIENDSHIPS[`bond_${ME.uid}_and_${peer.uid}`] !== 'confirmed') return;
      count++;
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between bg-darkbg p-2.5 rounded-xl border border-slate-800';
      row.innerHTML = `
        <span class="text-slate-300 font-medium text-xs">${peer.name} (@${peer.uid})</span>
        <input type="checkbox" value="${peer.uid}" class="group-checkbox h-4 w-4 accent-cyan-500">
      `;
      c.appendChild(row);
    });
    if (!count) c.innerHTML = `<p class="text-[10px] text-slate-600 italic text-center py-2">No network friends linked to build a group canvas.</p>`;
    document.getElementById('group-modal').classList.remove('hidden');
  }
  document.getElementById('close-group').addEventListener('click', () => {
    document.getElementById('group-modal').classList.add('hidden');
  });
  document.getElementById('create-group').addEventListener('click', () => {
    const title = document.getElementById('group-name').value.trim();
    if (!title) return toast('Error', 'Please provide group identity tag');
    const sel = document.querySelectorAll('.group-checkbox:checked');
    if (sel.length < 1) return toast('Error', 'Select at least one participant');
    toast('Group Created', 'Multiplex session initialized');
    document.getElementById('group-name').value = '';
    document.getElementById('group-modal').classList.add('hidden');
  });

  // ---- Cleanup ----
  window.addEventListener('beforeunload', () => {
    if (friendshipsUnsub) friendshipsUnsub();
    if (chatsUnsub) chatsUnsub();
    if (msgListenerUnsub) msgListenerUnsub();
  });
</script>
</body>
</html>
