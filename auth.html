<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust Hub — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
      darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
    }}}
  };
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background 0.3s, color 0.3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5; }
  body.light-mode .bg-darkcard { background:#ffffff; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb; }
  body.light-mode .text-slate-100 { color:#1a1a2e; }
  body.light-mode .text-slate-200 { color:#2d2d44; }
  body.light-mode .text-slate-400 { color:#6b6b8a; }
  body.light-mode .text-slate-500 { color:#8a8aa8; }
  body.light-mode .bg-darkbg\/95 { background:rgba(240,242,245,0.95); }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .spinner { border: 2px solid rgba(255,255,255,0.1); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .success-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#065f46,#047857); border: 1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index: 200; box-shadow: 0 20px 60px rgba(0,0,0,0.5); max-width: 90%; text-align:center; animation: toastIn 0.4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(20px) scale(0.9); } to { opacity:1; transform: translateX(-50%) translateY(0) scale(1); } }
</style>
</head>
<body class="dark-mode min-h-screen flex flex-col items-center justify-center p-6">

<div class="text-center max-w-sm w-full bg-darkcard p-8 rounded-3xl border border-slate-800 shadow-2xl">
  <h1 class="text-3xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">STARDUST</h1>
  <p id="auth-desc" class="text-slate-500 text-xs mb-6">Secure Custom Authentication Terminal</p>

  <!-- LOGIN -->
  <div id="login-form-container" class="space-y-4">
    <input type="text" id="login-identifier" placeholder="Email or 6-Digit UID"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <input type="password" id="login-password" placeholder="Enter Account Password"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <button id="login-btn" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold text-sm shadow-lg shadow-blue-600/20 transition">
      <span id="btn-text-login">Sign In Session</span>
      <div id="btn-spinner-login" class="spinner hidden"></div>
    </button>
    <div class="flex flex-wrap items-center justify-between gap-1 text-xs pt-1">
      <p class="text-slate-400">Don't have an account?
        <span data-switch="signup" class="text-cyan-400 font-bold cursor-pointer hover:underline">Create New Account</span>
      </p>
      <span id="forgot-link" class="text-blue-400 font-bold cursor-pointer hover:underline">Forgot Password?</span>
    </div>
  </div>

  <!-- SIGNUP -->
  <div id="signup-form-container" class="space-y-4 hidden">
    <input type="file" id="signup-pfp" accept="image/*"
      class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-slate-800 file:text-slate-200">
    <input type="text" id="signup-name" placeholder="Full Name"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <input type="email" id="signup-email" placeholder="Enter Valid Email Address"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <input type="password" id="signup-password" placeholder="Create Secure Password"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <textarea id="signup-bio" placeholder="Tell us about yourself..." rows="3"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200 resize-none"></textarea>
    <button id="signup-btn" class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm shadow-lg shadow-emerald-600/20 transition">
      <span id="btn-text-signup">Register & Generate UID</span>
      <div id="btn-spinner-signup" class="spinner hidden"></div>
    </button>
    <p class="text-xs text-slate-400">Already registered?
      <span data-switch="login" class="text-blue-400 font-bold cursor-pointer hover:underline">Login Securely</span>
    </p>
  </div>

  <div class="mt-6 pt-4 border-t border-slate-800 flex justify-center gap-3 text-[10px]">
    <a href="privacy.html" class="text-blue-400 hover:underline font-medium">Privacy Policy</a>
    <span class="text-slate-500">|</span>
    <a href="terms.html" class="text-blue-400 hover:underline font-medium">Terms of Service</a>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgot-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-darkcard w-full max-w-sm rounded-3xl border border-slate-800 p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-sm font-bold text-slate-100">Reset Password</h3>
      <button id="close-forgot" class="text-slate-500 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <p class="text-xs text-slate-500 mb-4">Enter your email address and we'll send you a password reset link.</p>
    <input type="email" id="reset-email-input" placeholder="Enter your email"
      class="w-full px-4 py-3 bg-darkbg border border-slate-800 rounded-xl text-sm focus:outline-none text-center text-slate-200">
    <button id="send-reset-btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold text-sm transition">Send Reset Link</button>
  </div>
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm">Success</p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5">Done</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
           onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // ---- Theme ----
  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  // ---- Toast ----
  function toast(title, msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => t.classList.add('hidden'), 3500);
  }

  // ---- Redirect if already signed in ----
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace('main.html');
  });

  // ---- Switch login/signup ----
  document.querySelectorAll('[data-switch]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.dataset.switch;
      if (v === 'signup') {
        document.getElementById('login-form-container').classList.add('hidden');
        document.getElementById('signup-form-container').classList.remove('hidden');
        document.getElementById('auth-desc').textContent = 'Create Your Professional Stardust Node';
      } else {
        document.getElementById('signup-form-container').classList.add('hidden');
        document.getElementById('login-form-container').classList.remove('hidden');
        document.getElementById('auth-desc').textContent = 'Secure Custom Authentication Terminal';
      }
    });
  });

  // ---- Forgot password ----
  document.getElementById('forgot-link').addEventListener('click', () => {
    document.getElementById('forgot-modal').classList.remove('hidden');
  });
  document.getElementById('close-forgot').addEventListener('click', () => {
    document.getElementById('forgot-modal').classList.add('hidden');
  });
  document.getElementById('send-reset-btn').addEventListener('click', async () => {
    const email = document.getElementById('reset-email-input').value.trim();
    if (!email) return toast('Error', 'Please enter an email');
    try {
      await sendPasswordResetEmail(auth, email);
      document.getElementById('forgot-modal').classList.add('hidden');
      toast('Reset Link Sent', 'Check your email for instructions');
    } catch (e) { toast('Error', e.message); }
  });

  // ---- Login ----
  document.getElementById('login-btn').addEventListener('click', async () => {
    const id = document.getElementById('login-identifier').value.trim();
    const pw = document.getElementById('login-password').value.trim();
    if (!id || !pw) return toast('Error', 'Enter both fields');

    document.getElementById('btn-text-login').classList.add('hidden');
    document.getElementById('btn-spinner-login').classList.remove('hidden');

    const fail = (msg) => {
      document.getElementById('btn-text-login').classList.remove('hidden');
      document.getElementById('btn-spinner-login').classList.add('hidden');
      toast('Login Failed', msg);
    };

    try {
      let email = id;
      if (!id.includes('@')) {
        // Look up by 6-digit UID
        const snap = await get(ref(db, 'users'));
        const data = snap.val();
        let found = null;
        if (data) {
          for (const k of Object.keys(data)) {
            if (data[k] && data[k].uid === id) { found = data[k]; break; }
          }
        }
        if (!found || !found.email) return fail('UID not found');
        email = found.email;
      }
      await signInWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged will redirect
    } catch (e) {
      fail(e.message.replace('Firebase: ',''));
    }
  });

  // ---- Signup ----
  document.getElementById('signup-btn').addEventListener('click', async () => {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pw = document.getElementById('signup-password').value.trim();
    const bio = document.getElementById('signup-bio').value.trim();
    const pfpFile = document.getElementById('signup-pfp').files[0];

    if (!name || !email || !pw) return toast('Error', 'Fill required fields');

    document.getElementById('btn-text-signup').classList.add('hidden');
    document.getElementById('btn-spinner-signup').classList.remove('hidden');

    const fail = (msg) => {
      document.getElementById('btn-text-signup').classList.remove('hidden');
      document.getElementById('btn-spinner-signup').classList.add('hidden');
      toast('Signup Failed', msg);
    };

    const finish = async (pfpData) => {
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        const uid = Math.floor(100000 + Math.random() * 900000).toString();
        const userData = {
          name, email, uid,
          realFirebaseUID: cred.user.uid,
          bio: bio || "Hello, I'm new here!",
          pfp: pfpData || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
          profession: '',
          isPremium: false,
          premiumTheme: '', premiumFrame: '', premiumFont: '',
          premiumExpiry: 0,
          savedPosts: [], savedReels: [], notifications: []
        };
        await set(ref(db, 'users/' + uid), userData);
        toast('Welcome!', 'Account created');
        // onAuthStateChanged will redirect
      } catch (e) {
        fail(e.message.replace('Firebase: ',''));
      }
    };

    if (pfpFile) {
      const reader = new FileReader();
      reader.onload = (e) => finish(e.target.result);
      reader.onerror = () => fail('Failed to read image');
      reader.readAsDataURL(pfpFile);
    } else {
      finish(null);
    }
  });
</script>
</body>
</html>
