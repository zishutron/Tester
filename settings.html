<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-100 { background:#f0f0f5 !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .bg-slate-800\/60 { background:rgba(232,232,238,.6) !important; }
  body.light-mode .hover\:bg-slate-200:hover { background:#d8d8de !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.light-mode .border-slate-700 { border-color:#d0d2d6 !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .hidden { display:none !important; }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
  .toggle-track { width:40px; height:24px; background:#cbd5e1; border-radius:999px; position:relative; transition: background .2s; }
  .dark-mode .toggle-track { background:#475569; }
  .toggle-dot { position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle-on .toggle-track { background:#06b6d4; }
  .toggle-on .toggle-dot { transform: translateX(16px); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter: blur(6px); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-card { background:#1e293b; width:100%; max-width:400px; border-radius:22px; border:1px solid #334155; padding:20px; max-height:85vh; display:flex; flex-direction:column; }
  body.light-mode .modal-card { background:#ffffff; border-color:#e4e6eb; }
  .modal-card input[type=text], .modal-card textarea, .modal-card select { width:100%; background:#0b1528; border:1px solid #334155; border-radius:12px; padding:10px; color:#e2e8f0; font-size:12px; }
  body.light-mode .modal-card input[type=text], body.light-mode .modal-card textarea, body.light-mode .modal-card select { background:#f0f2f5; border-color:#e4e6eb; color:#1a1a2e; }
  .modal-card textarea { resize:none; }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-8 relative">
  <header class="px-4 py-4 bg-darkcard border-b border-slate-900 flex items-center gap-3">
    <a href="profile.html" class="p-2 bg-slate-800/50 rounded-full border border-slate-700 hover:bg-slate-700 transition">

    <button data-page="edit-profile" class="w-full bg-slate-800/60 border border-slate-800 text-left p-3 rounded-xl text-xs font-semibold flex justify-between hover:bg-slate-800 transition text-slate-300">

    <a href="saved.html" class="w-full bg-slate-800/60 border border-slate-800 text-left p-3 rounded-xl text-xs font-semibold flex justify-between hover:bg-slate-800 transition text-slate-300 no-underline">

      <span>Terms of Service</span><span>→</span>

    <button id="logout-btn" class="w-full bg-red-950/40 border border-red-900/40 text-left p-3 rounded-xl text-xs font-bold text-red-400 flex justify-between hover:bg-red-900/30 transition mt-4">
      <span>Terminate Ecosystem Connection</span><span>⇥</span>
    </button>
    <button id="delete-btn" class="w-full bg-red-950/40 border border-red-900/40 text-left p-3 rounded-xl text-xs font-bold text-red-400 flex justify-between hover:bg-red-900/30 transition">
      <span>Delete Account</span><span>×</span>
    </button>
  </main>
</div>

          <button data-frame="premium-frame-cyan" class="bg-slate-800/50 border border-slate-600 p-2.5 rounded-xl hover:bg-slate-700 transition">Cyan</button>
          <button data-frame="premium-frame-pink" class="bg-slate-800/50 border border-slate-600 p-2.5 rounded-xl hover:bg-slate-700 transition">Pink</button>
          <button data-frame="premium-frame-purple" class="bg-slate-800/50 border border-slate-600 p-2.5 rounded-xl hover:bg-slate-700 transition">Purple</button>
          <button data-frame="premium-frame-emerald" class="bg-slate-800/50 border border-slate-600 p-2.5 rounded-xl hover:bg-slate-700 transition">Emerald</button>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const FIXED_PROFESSIONS = ["Architect", "Software Engineer", "Systems Analyst", "Cybersecurity Specialist", "Creative Designer"];

  function applyTheme(theme) {
    document.body.classList.remove('light-mode','dark-mode');
    document.body.classList.add(theme + '-mode');
    const toggle = document.getElementById('theme-toggle');
    if (theme === 'dark') toggle.classList.add('toggle-on');
    else toggle.classList.remove('toggle-on');
    localStorage.setItem('stardust_theme', theme);
  }
  applyTheme(localStorage.getItem('stardust_theme') || 'light');

  document.getElementById('theme-row').addEventListener('click', () => {
    const cur = localStorage.getItem('stardust_theme') || 'light';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  });

  let ME = null;
  let MY_DB_KEY = null;

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    for (const k of Object.keys(users)) {
      if (users[k] && users[k].realFirebaseUID === user.uid) {
        ME = users[k];
        MY_DB_KEY = k;
        break;
      }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    if (ME.isPremium && ME.premiumExpiry && Date.now() > ME.premiumExpiry) {
      await update(ref(db, `users/${MY_DB_KEY}`), { isPremium: false, premiumTheme: '', premiumFrame: '', premiumFont: '' });
      ME.isPremium = false; ME.premiumTheme = ''; ME.premiumFrame = ''; ME.premiumFont = '';
      toast('Premium Expired', 'Your premium has ended.');
    }

    onValue(ref(db, `users/${MY_DB_KEY}`), (s) => {
      const data = s.val();
      if (data) ME = data;
    });

    if (window.location.hash === '#premium') openPremium();
  });

  // ============================================================
  // SUB SETTINGS
  // ============================================================
  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => openSub(btn.dataset.page));
  });

  async function openSub(type) {
    const title = document.getElementById('sub-title');
    const body = document.getElementById('sub-body');
    body.innerHTML = '';
    document.getElementById('sub-modal').classList.remove('hidden');

    if (type === 'edit-profile') {
      title.textContent = 'Edit Profile';
      body.innerHTML = `
        <div class="space-y-3">
          <div>
            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Display Name</label>
            <input id="sub-name" type="text" value="${ME.name || ''}">
          </div>
          <div>
            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Profile Avatar</label>
            <input id="sub-pfp" type="file" accept="image/*" class="w-full text-slate-500 text-[11px]">
            <div id="sub-pfp-preview-wrap" class="mt-2 ${ME.pfp ? '' : 'hidden'}">
              <img id="sub-pfp-preview" src="${ME.pfp || ''}" class="w-16 h-16 rounded-full object-cover border border-slate-700">
            </div>
          </div>
          <div>
            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Biography</label>
            <textarea id="sub-bio" rows="3">${ME.bio || ''}</textarea>
          </div>
          <div>
            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Profession</label>
            <select id="sub-prof">
              <option value="">(None)</option>
              ${FIXED_PROFESSIONS.map(p => `<option value="${p}" ${ME.profession === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <button id="sub-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl mt-2">Save Changes</button>
        </div>
      `;
      document.getElementById('sub-save').addEventListener('click', saveProfileEdit);
      document.getElementById('sub-pfp').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
          document.getElementById('sub-pfp-preview').src = ev.target.result;
          document.getElementById('sub-pfp-preview-wrap').classList.remove('hidden');
        };
        r.readAsDataURL(f);
      });
    }

    else if (type === 'liked-posts') {
      title.textContent = 'Liked Publications';
      const snap = await get(ref(db, 'publications'));
      const data = snap.val() || {};
      const liked = Object.keys(data).map(k => data[k]).filter(p => p && p.likes && p.likes[ME.uid]);
      if (!liked.length) {
        body.innerHTML = `<p class="text-center text-slate-600 py-4">No liked publications yet.</p>`;
      } else {
        liked.forEach(p => {
          body.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl mb-2">
              <p class="text-slate-300">${p.text || '(no text)'}</p>
              ${p.image ? `<div class="mt-2 rounded-lg overflow-hidden max-h-32"><img src="${p.image}" class="w-full h-full object-cover" loading="lazy"></div>` : ''}
            </div>`;
        });
      }
    }

    else if (type === 'commented-posts') {
      title.textContent = 'Commented Logs';
      const snap = await get(ref(db, 'publications'));
      const data = snap.val() || {};
      let found = [];
      Object.keys(data).forEach(k => {
        const p = data[k];
        if (p && p.comments) {
          Object.values(p.comments).forEach(cm => {
            if (cm.authorUID === ME.uid) found.push({ post: p.text || '(no text)', comment: cm.text });
          });
        }
      });
      if (!found.length) {
        body.innerHTML = `<p class="text-center text-slate-600 py-4">No comments yet.</p>`;
      } else {
        found.forEach(c => {
          body.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl mb-2">
              <p class="text-slate-500 text-[10px]">On: ${c.post}</p>
              <p class="text-slate-300 mt-1">${c.comment}</p>
            </div>`;
        });
      }
    }
  }

  async function saveProfileEdit() {
    const name = document.getElementById('sub-name').value.trim();
    const bio = document.getElementById('sub-bio').value.trim();
    const prof = document.getElementById('sub-prof').value;
    const fileInput = document.getElementById('sub-pfp');

    if (!name) { toast('Error', 'Name is required'); return; }

    const commit = async (pfpBase64) => {
      const payload = { name, bio, profession: prof };
      if (pfpBase64) payload.pfp = pfpBase64;
      try {
        await update(ref(db, `users/${MY_DB_KEY}`), payload);
        ME.name = name; ME.bio = bio; ME.profession = prof;
        if (pfpBase64) ME.pfp = pfpBase64;
        document.getElementById('sub-modal').classList.add('hidden');
        toast('Saved', 'Profile updated successfully');
      } catch (e) {
        toast('Error', e.message);
      }
    };

    if (fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => commit(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      commit(null);
    }
  }

  document.getElementById('close-sub').addEventListener('click', () => {
    document.getElementById('sub-modal').classList.add('hidden');
  });

  // ============================================================
  // PREMIUM
  // ============================================================
  function openPremium() {
    document.getElementById('premium-modal').classList.remove('hidden');
    const activateWrap = document.getElementById('premium-activate-wrap');
    const tweakWrap = document.getElementById('premium-tweak-wrap');
    if (ME.isPremium) {
      activateWrap.classList.add('hidden');
      tweakWrap.classList.remove('hidden');
    } else {
      activateWrap.classList.remove('hidden');
      tweakWrap.classList.add('hidden');
    }
  }

  document.getElementById('premium-btn').addEventListener('click', openPremium);
  document.getElementById('close-premium').addEventListener('click', () => {
    document.getElementById('premium-modal').classList.add('hidden');
  });

  document.getElementById('activate-premium').addEventListener('click', async () => {
    const expiry = Date.now() + 30*24*60*60*1000;
    try {
      await update(ref(db, `users/${MY_DB_KEY}`), { isPremium: true, premiumExpiry: expiry });
      ME.isPremium = true; ME.premiumExpiry = expiry;
      toast('Premium Activated', 'You now have 30 days of premium');
      setTimeout(openPremium, 400);
    } catch (e) {
      toast('Error', e.message);
    }
  });

  document.querySelectorAll('[data-theme]').forEach(b => {
    b.addEventListener('click', async () => {
      try {
        await update(ref(db, `users/${MY_DB_KEY}`), { premiumTheme: b.dataset.theme });
        ME.premiumTheme = b.dataset.theme;
        toast('Applied', 'Theme updated');
      } catch (e) { toast('Error', e.message); }
    });
  });
  document.querySelectorAll('[data-frame]').forEach(b => {
    b.addEventListener('click', async () => {
      try {
        await update(ref(db, `users/${MY_DB_KEY}`), { premiumFrame: b.dataset.frame });
        ME.premiumFrame = b.dataset.frame;
        toast('Applied', 'Frame updated');
      } catch (e) { toast('Error', e.message); }
    });
  });
  document.querySelectorAll('[data-font]').forEach(b => {
    b.addEventListener('click', async () => {
      try {
        await update(ref(db, `users/${MY_DB_KEY}`), { premiumFont: b.dataset.font });
        ME.premiumFont = b.dataset.font;
        toast('Applied', 'Font updated');
      } catch (e) { toast('Error', e.message); }
    });
  });
  document.getElementById('clear-premium').addEventListener('click', async () => {
    try {
      await update(ref(db, `users/${MY_DB_KEY}`), { premiumTheme: '', premiumFrame: '', premiumFont: '' });
      ME.premiumTheme = ''; ME.premiumFrame = ''; ME.premiumFont = '';
      toast('Reset', 'Premium styles cleared');
    } catch (e) { toast('Error', e.message); }
  });

  // ============================================================
  // LOGOUT + DELETE ACCOUNT
  // ============================================================
  document.getElementById('logout-btn').addEventListener('click', async () => {
    if (!confirm('Sign out of Stardust?')) return;
    try {
      await signOut(auth);
      localStorage.removeItem('STARDUST_CORE_DB_PROD');
      window.location.replace('auth.html');
    } catch (e) {
      toast('Error', e.message);
    }
  });

  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Permanently delete your account? All posts, reels and data will be lost.')) return;
    if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
    const user = auth.currentUser;
    if (!user) return;
    try {
      await remove(ref(db, 'users/' + ME.uid));
      await deleteUser(user);
      localStorage.removeItem('STARDUST_CORE_DB_PROD');
      toast('Deleted', 'Account permanently removed');
      setTimeout(() => window.location.replace('auth.html'), 1200);
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        toast('Error', 'Please sign out, sign in again, then retry.');
      } else {
        toast('Error', e.message);
      }
    }
  });
</script>
</body>
</html>
