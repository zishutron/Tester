<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const FIXED_PROFESSIONS = ["Architect", "Software Engineer", "Systems Analyst", "Cybersecurity Specialist", "Creative Designer"];

  // Theme handling
  function applyTheme(theme) {
    document.body.classList.remove('light-mode','dark-mode');
    document.body.classList.add(theme + '-mode');
    const toggle = document.getElementById('theme-toggle');
    if (theme === 'dark') toggle.classList.add('toggle-on');
    else toggle.classList.remove('toggle-on');
    localStorage.setItem('stardust_theme', theme);
  }
  applyTheme(localStorage.getItem('stardust_theme') || 'light');

  document.getElementById('theme-row').addEventListener('click', () => {
    const cur = localStorage.getItem('stardust_theme') || 'light';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  });

  let ME = null;

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }

    // Live watch on ME record so premium toggle reflects immediately
    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    let myNodeKey = null;
    for (const k of Object.keys(users)) {
      if (users[k] && users[k].realFirebaseUID === user.uid) { ME = users[k]; myNodeKey = k; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    // Check premium expiry on load
    if (ME.isPremium && ME.premiumExpiry && Date.now() > ME.premiumExpiry) {
      await update(ref(db, `users/${myNodeKey}`), { isPremium: false, premiumTheme: '', premiumFrame: '', premiumFont: '' });
      ME.isPremium = false; ME.premiumTheme = ''; ME.premiumFrame = ''; ME.premiumFont = '';
      toast('Premium Expired', 'Your premium subscription has ended.');
    }

    // Watch for live premium updates
    onValue(ref(db, `users/${myNodeKey}`), (s) => {
      const data = s.val();
      if (data) ME = data;
    });

    // Deep-link #premium
    if (window.location.hash === '#premium') openPremium();
  });

  // Sub-settings
  let subData = null;

  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => openSub(btn.dataset.page));
  });

  async function openSub(type) {
    const title = document.getElementById('sub-title');
    const body = document.getElementById('sub-body');
    body.innerHTML = '';

    if (type === 'edit-profile') {
      title.textContent = 'Edit Profile';
      body.innerHTML = `
        <div class="space-y-3">
          <div><label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Display Name</label>
            <input id="sub-name" type="text" value="${ME.name}" class="w-full bg-darkbg border border-slate-800 rounded-xl px-3 py-2 text-slate-200"></div>
          <div><label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Profile Avatar</label>
            <input id="sub-pfp" type="file" accept="image/*" class="w-full text-slate-500 text-[11px]"></div>
          <div><label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Biography</label>
            <textarea id="sub-bio" class="w-full bg-darkbg border border-slate-800 rounded-xl px-3 py-2 resize-none h-20 text-slate-200">${ME.bio || ''}</textarea></div>
          <div><label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Profession</label>
            <select id="sub-prof" class="w-full bg-darkbg border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="">(None)</option>
              ${FIXED_PROFESSIONS.map(p => `<option value="${p}" ${ME.profession === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select></div>
          <button id="sub-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl mt-2">Save Changes</button>
        </div>
      `;
      document.getElementById('sub-save').addEventListener('click', saveProfileEdit);
    } else if (type === 'liked-posts') {
      title.textContent = 'Liked Publications';
      const snap = await get(ref(db, 'publications'));
      const data = snap.val() || {};
      const liked = Object.keys(data).map(k => data[k]).filter(p => p && p.likes && p.likes[ME.uid]);
      if (!liked.length) body.innerHTML = `<p class="text-center text-slate-600">No liked publications yet.</p>`;
      else {
        liked.forEach(p => {
          body.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl mb-1">
              <p class="text-slate-300">${p.text || ''}</p>
              ${p.image ? `<div class="mt-1 rounded-lg overflow-hidden max-h-24"><img src="${p.image}" class="w-full h-full object-cover" loading="lazy"></div>` : ''}
            </div>`;
        });
      }
    } else if (type === 'commented-posts') {
      title.textContent = 'Commented Logs';
      const snap = await get(ref(db, 'publications'));
      const data = snap.val() || {};
      let found = [];
      Object.keys(data).forEach(k => {
        const p = data[k];
        if (p && p.comments) {
          Object.values(p.comments).forEach(cm => {
            if (cm.authorUID === ME.uid) found.push({ post: p.text, comment: cm.text });
          });
        }
      });
      if (!found.length) body.innerHTML = `<p class="text-center text-slate-600">No comments yet.</p>`;
      else found.forEach(c => {
        body.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl mb-1">
            <p class="text-slate-500 text-[10px]">On: ${c.post}</p>
            <p class="text-slate-300 mt-1">${c.comment}</p>
          </div>`;
      });
    }

    document.getElementById('sub-modal').classList.remove('hidden');
  }

  async function saveProfileEdit() {
    const name = document.getElementById('sub-name').value.trim();
    const bio = document.getElementById('sub-bio').value.trim();
    const prof = document.getElementById('sub-prof').value;
    const fileInput = document.getElementById('sub-pfp');

    if (!name) return toast('Error', 'Name is required');

    const commit = async (pfpBase64) => {
      const payload = { name, bio, profession: prof };
      if (pfpBase64) payload.pfp = pfpBase64;
      await update(ref(db, `users/${ME.uid}`), payload);
      document.getElementById('sub-modal').classList.add('hidden');
      toast('Saved', 'Profile updated');
    };

    if (fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = (e) => commit(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      commit(null);
    }
  }

  document.getElementById('close-sub').addEventListener('click', () => {
    document.getElementById('sub-modal').classList.add('hidden');
  });

  // Premium
  function openPremium() {
    const modal = document.getElementById('premium-modal');
    modal.classList.remove('hidden');
    const activateWrap = document.getElementById('premium-activate-wrap');
    const tweakWrap = document.getElementById('premium-tweak-wrap');
    if (ME.isPremium) {
      activateWrap.classList.add('hidden');
      tweakWrap.classList.remove('hidden');
    } else {
      activateWrap.classList.remove('hidden');
      tweakWrap.classList.add('hidden');
    }
  }
  document.getElementById('premium-btn').addEventListener('click', openPremium);
  document.getElementById('close-premium').addEventListener('click', () => {
    document.getElementById('premium-modal').classList.add('hidden');
  });

  document.getElementById('activate-premium').addEventListener('click', async () => {
    const expiry = Date.now() + 30*24*60*60*1000;
    await update(ref(db, `users/${ME.uid}`), { isPremium: true, premiumExpiry: expiry });
    toast('Premium Activated', 'You now have 30 days of premium');
    setTimeout(openPremium, 300);
  });

  document.querySelectorAll('[data-theme]').forEach(b => {
    b.addEventListener('click', async () => {
      await update(ref(db, `users/${ME.uid}`), { premiumTheme: b.dataset.theme });
      toast('Applied', 'Theme updated');
    });
  });
  document.querySelectorAll('[data-frame]').forEach(b => {
    b.addEventListener('click', async () => {
      await update(ref(db, `users/${ME.uid}`), { premiumFrame: b.dataset.frame });
      toast('Applied', 'Frame updated');
    });
  });
  document.querySelectorAll('[data-font]').forEach(b => {
    b.addEventListener('click', async () => {
      await update(ref(db, `users/${ME.uid}`), { premiumFont: b.dataset.font });
      toast('Applied', 'Font updated');
    });
  });
  document.getElementById('clear-premium').addEventListener('click', async () => {
    await update(ref(db, `users/${ME.uid}`), { premiumTheme: '', premiumFrame: '', premiumFont: '' });
    toast('Reset', 'Premium styles cleared');
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', async () => {
    if (!confirm('Sign out of Stardust?')) return;
    await signOut(auth);
    localStorage.removeItem('STARDUST_CORE_DB_PROD');
    window.location.replace('auth.html');
  });

  // Delete account
  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Permanently delete your account? All posts, reels and data will be lost.')) return;
    if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
    const user = auth.currentUser;
    if (!user) return;
    try {
      await remove(ref(db, 'users/' + ME.uid));
      await deleteUser(user);
      localStorage.removeItem('STARDUST_CORE_DB_PROD');
      toast('Deleted', 'Account permanently removed');
      setTimeout(() => window.location.replace('auth.html'), 1200);
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        toast('Error', 'Please sign out and sign in again, then retry.');
      } else {
        toast('Error', e.message);
      }
    }
  });
</script>
</body>
</html>
