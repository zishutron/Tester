<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Create</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    lightbg:'#f0f2f5', lightcard:'#ffffff', lightborder:'#e4e6eb',
    darkbg:'#0b1528', darkcard:'#1e293b', accentblue:'#2563eb', neoncyan:'#06b6d4'
  }}}};
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; transition: background .3s, color .3s; }
  body.light-mode { background:#f0f2f5; color:#1a1a2e; }
  body.light-mode .bg-darkbg { background:#f0f2f5 !important; }
  body.light-mode .bg-darkcard { background:#ffffff !important; }
  body.light-mode .border-slate-800 { border-color:#e4e6eb !important; }
  body.light-mode .border-slate-900 { border-color:#d0d2d6 !important; }
  body.light-mode .text-slate-100 { color:#1a1a2e !important; }
  body.light-mode .text-slate-200 { color:#2d2d44 !important; }
  body.light-mode .text-slate-300 { color:#3d3d5c !important; }
  body.light-mode .text-slate-400 { color:#6b6b8a !important; }
  body.light-mode .text-slate-500 { color:#8a8aa8 !important; }
  body.light-mode .text-slate-600 { color:#a0a0b8 !important; }
  body.light-mode .bg-slate-800 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-900 { background:#f5f5f8 !important; }
  body.light-mode .bg-slate-200 { background:#e8e8ee !important; }
  body.light-mode .bg-slate-800\/50 { background:rgba(232,232,238,.5) !important; }
  body.light-mode .bg-slate-900\/50 { background:rgba(245,245,248,.5) !important; }
  body.light-mode .hover\:bg-slate-300:hover { background:#d8d8de !important; }
  body.light-mode .hover\:bg-slate-700:hover { background:#c8c8d0 !important; }
  body.light-mode .hover\:bg-slate-800:hover { background:#dddde4 !important; }
  body.light-mode .border-slate-300 { border-color:#d0d2d6 !important; }
  body.dark-mode { background:#0b1528; color:#f1f5f9; }
  .hidden { display:none !important; }
  .spinner { border:2px solid rgba(255,255,255,.15); width:16px; height:16px; border-radius:50%; border-left-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab-btn { transition:all .25s ease; }
  .tab-btn.active { background:#1e293b; color:#06b6d4; }
  .tab-btn:not(.active) { color:#64748b; }
  .tab-btn:not(.active):hover { color:#94a3b8; }
  body.light-mode .tab-btn.active { background:#e8e8ee; color:#2563eb; }
  body.light-mode .tab-btn:not(.active) { color:#6b6b8a; }
  body.light-mode .tab-btn:not(.active):hover { color:#3d3d5c; }
  .success-toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#065f46,#047857); border:1px solid #34d399; color:#fff; padding:14px 20px; border-radius:18px; z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:90%; text-align:center; animation:toastIn .4s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px) scale(.9);} to { opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }
  .upload-loading { position:absolute; inset:-4px; border-radius:50%; border:3px solid transparent; border-top-color:#06b6d4; border-right-color:#06b6d4; animation:spin .8s linear infinite; }
  .preview-box { border:1px dashed #334155; border-radius:14px; padding:10px; text-align:center; }
  body.light-mode .preview-box { border-color:#d0d2d6; }
</style>
</head>
<body class="light-mode bg-darkbg min-h-screen">

<div class="max-w-md mx-auto w-full min-h-screen bg-darkbg pb-24 relative">
  <header class="px-4 py-4 bg-darkcard border-b border-slate-900 flex items-center gap-3">
    <a href="main.html" class="p-2 bg-slate-800/50 rounded-full border border-slate-700 hover:bg-slate-700 transition">
      <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 id="page-title" class="text-sm font-black uppercase tracking-widest text-slate-300">Create New</h1>
  </header>

  <main class="px-4 py-4 space-y-4">
    <!-- Tabs -->
    <div id="tabs-container" class="flex bg-slate-900/50 rounded-xl p-1">
      <button id="tab-post" class="tab-btn active flex-1 py-2 rounded-lg text-xs font-bold">
        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Post
      </button>
      <button id="tab-reel" class="tab-btn flex-1 py-2 rounded-lg text-xs font-bold">
        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        Reel
      </button>
    </div>

    <!-- Post area -->
    <div id="post-area" class="space-y-3">
      <textarea id="post-text" rows="5" placeholder="What's on your mind?"
        class="w-full p-3 border border-slate-800 bg-darkbg rounded-xl text-sm text-slate-200 focus:outline-none resize-none"></textarea>

      <div class="preview-box">
        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Attach Image (optional)</label>
        <input type="file" id="post-file" accept="image/*"
          class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-slate-800 file:text-slate-200">
        <div id="post-preview-wrap" class="mt-3 hidden">
          <img id="post-preview" class="max-h-48 w-full object-cover rounded-xl">
          <button id="post-clear-img" class="text-[10px] text-red-400 underline mt-2">Remove image</button>
        </div>
      </div>

      <button id="publish-post-btn" class="w-full relative flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-sm font-bold transition">
        <span id="post-btn-text">Publish Post</span>
        <div id="post-btn-spinner" class="spinner hidden"></div>
      </button>
    </div>

    <!-- Reel area -->
    <div id="reel-area" class="space-y-3 hidden">
      <div class="preview-box">
        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Select Video (required)</label>
        <input type="file" id="reel-file" accept="video/*"
          class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-slate-800 file:text-slate-200">
        <video id="reel-preview" class="mt-3 max-h-56 w-full object-cover rounded-xl hidden" muted playsinline controls></video>
        <div id="reel-upload-progress" class="hidden mt-3">
          <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
            <div id="reel-progress-bar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full transition-all" style="width:0%"></div>
          </div>
          <p id="reel-progress-text" class="text-[10px] text-slate-500 mt-1 text-center">Uploading...</p>
        </div>
      </div>

      <input type="text" id="reel-caption" placeholder="Caption (optional)"
        class="w-full px-3 py-2 bg-darkbg border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none">

      <button id="upload-reel-btn" class="w-full relative flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white py-3 rounded-xl text-sm font-bold transition">
        <span id="reel-btn-text">Upload Reel</span>
        <div id="reel-btn-spinner" class="spinner hidden"></div>
      </button>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkcard/95 backdrop-blur-md border-t border-slate-900 h-16 flex justify-around items-center z-40">
    <a href="main.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="chat.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    </a>
    <a href="reels.html" class="text-slate-500 hover:text-pink-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </a>
    <a href="search.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </a>
    <a href="profile.html" class="text-slate-500 hover:text-cyan-400 flex flex-col items-center flex-1 py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z"/></svg>
    </a>
  </nav>
</div>

<!-- COMMENT MODAL -->
<div id="comment-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-darkcard w-full max-w-sm rounded-3xl border border-slate-800 p-5 flex flex-col max-h-[85vh]">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
      <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Comments</span>
      <button id="close-comment-modal" class="text-slate-500 hover:text-white text-xs bg-slate-800 px-2.5 py-1 rounded-lg">Close</button>
    </div>
    <div id="comment-post-body" class="text-slate-300 text-xs mb-3 pb-3 border-b border-slate-800"></div>
    <div id="comment-list" class="flex-1 overflow-y-auto space-y-2 mb-3"></div>
    <div class="flex gap-2 pt-3 border-t border-slate-800">
      <input type="text" id="comment-input" placeholder="Add a comment..."
        class="flex-1 bg-darkbg border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none">
      <button id="comment-send-btn" class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded-xl text-xs font-bold text-white">Post</button>
    </div>
  </div>
</div>

<div id="toast" class="success-toast hidden">
  <p id="toast-title" class="font-bold text-sm"></p>
  <p id="toast-message" class="text-xs text-emerald-200 mt-0.5"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { getDatabase, ref, get, set, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5ufTBjot8i-PJCBkJtUpc50jJcYmzMBQ",
    authDomain: "stardust-hub.firebaseapp.com",
    databaseURL: "https://stardust-hub-default-rtdb.firebaseio.com",
    projectId: "stardust-hub",
    storageBucket: "stardust-hub.firebasestorage.app",
    messagingSenderId: "672339143681",
    appId: "1:672339143681:web:42d7e7f3fd923890aba400"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // Cloudinary (matches existing project)
  const CLOUDINARY = { cloudName: 'cbvgkw1a', uploadPreset: 'stardust_reels' };

  // Theme
  const theme = localStorage.getItem('stardust_theme') || 'light';
  document.body.classList.remove('light-mode','dark-mode');
  document.body.classList.add(theme + '-mode');

  let ME = null;
  let editMode = false;
  let editingPostId = null;
  let currentPostImageBase64 = null;
  let currentReelFile = null;

  function toast(title, msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-title').textContent = title;
    document.getElementById('toast-message').textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTO);
    window._toastTO = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  // ---- Tabs ----
  const tabPost = document.getElementById('tab-post');
  const tabReel = document.getElementById('tab-reel');
  const postArea = document.getElementById('post-area');
  const reelArea = document.getElementById('reel-area');

  tabPost.addEventListener('click', () => {
    if (editMode) return;
    tabPost.classList.add('active'); tabReel.classList.remove('active');
    postArea.classList.remove('hidden'); reelArea.classList.add('hidden');
  });
  tabReel.addEventListener('click', () => {
    if (editMode) return;
    tabReel.classList.add('active'); tabPost.classList.remove('active');
    reelArea.classList.remove('hidden'); postArea.classList.add('hidden');
  });

  // ---- Auth gate + load ME ----
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.replace('auth.html'); return; }
    const usersSnap = await get(ref(db, 'users'));
    const users = usersSnap.val() || {};
    for (const k of Object.keys(users)) {
      if (users[k] && users[k].realFirebaseUID === user.uid) { ME = users[k]; break; }
    }
    if (!ME) { window.location.replace('auth.html'); return; }

    // Edit mode detection
    const params = new URLSearchParams(window.location.search);
    if (params.get('edit') === '1') {
      editingPostId = sessionStorage.getItem('edit_post_id');
      if (editingPostId) { editMode = true; loadEditPost(editingPostId); }
    }

    // Comment deep-link
    const pending = sessionStorage.getItem('open_post_id');
    if (pending) {
      sessionStorage.removeItem('open_post_id');
      openCommentModal(pending);
    }
  });

  async function loadEditPost(postId) {
    document.getElementById('page-title').textContent = 'Edit Post';
    document.getElementById('tabs-container').classList.add('hidden');
    document.getElementById('reel-area').classList.add('hidden');
    postArea.classList.remove('hidden');
    document.getElementById('post-btn-text').textContent = 'Save Changes';

    const snap = await get(ref(db, 'publications'));
    const data = snap.val() || {};
    for (const k of Object.keys(data)) {
      if (data[k] && data[k].id === postId) {
        document.getElementById('post-text').value = data[k].text || '';
        if (data[k].image) {
          currentPostImageBase64 = data[k].image;
          document.getElementById('post-preview').src = data[k].image;
          document.getElementById('post-preview-wrap').classList.remove('hidden');
        }
        return;
      }
    }
  }

  // ---- Post: image preview ----
  document.getElementById('post-file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentPostImageBase64 = ev.target.result;
      document.getElementById('post-preview').src = ev.target.result;
      document.getElementById('post-preview-wrap').classList.remove('hidden');
    };
    reader.readAsDataURL(f);
  });
  document.getElementById('post-clear-img').addEventListener('click', () => {
    currentPostImageBase64 = null;
    document.getElementById('post-file').value = '';
    document.getElementById('post-preview-wrap').classList.add('hidden');
  });

  // ---- Post publish / edit save ----
  document.getElementById('publish-post-btn').addEventListener('click', async () => {
    const text = document.getElementById('post-text').value.trim();
    if (!text && !currentPostImageBase64) return toast('Error', 'Add text or an image');

    const btn = document.getElementById('publish-post-btn');
    document.getElementById('post-btn-text').classList.add('hidden');
    document.getElementById('post-btn-spinner').classList.remove('hidden');
    btn.disabled = true;

    const done = () => {
      document.getElementById('post-btn-text').classList.remove('hidden');
      document.getElementById('post-btn-spinner').classList.add('hidden');
      btn.disabled = false;
    };

    try {
      if (editMode) {
        const snap = await get(ref(db, 'publications'));
        const data = snap.val() || {};
        for (const k of Object.keys(data)) {
          if (data[k] && data[k].id === editingPostId) {
            await update(ref(db, `publications/${k}`), {
              text,
              image: currentPostImageBase64
            });
            toast('Updated', 'Post updated');
            sessionStorage.removeItem('edit_post_id');
            setTimeout(() => window.location.replace('main.html'), 800);
            return;
          }
        }
      } else {
        const postNode = {
          id: 'post_' + Date.now() + '_' + Math.floor(Math.random()*1000),
          authorUID: ME.uid,
          authorName: ME.name,
          authorAvatar: ME.pfp,
          text,
          image: currentPostImageBase64 || null,
          timestamp: Date.now(),
          likes: {},
          comments: {}
        };
        await push(ref(db, 'publications'), postNode);
        toast('Published', 'Your post is live');
        setTimeout(() => window.location.replace('main.html'), 800);
      }
    } catch (e) {
      toast('Error', e.message);
      done();
    }
  });

  // ---- Reel preview ----
  document.getElementById('reel-file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith('video/')) { toast('Error', 'Select a video file'); return; }
    currentReelFile = f;
    const url = URL.createObjectURL(f);
    const v = document.getElementById('reel-preview');
    v.src = url;
    v.classList.remove('hidden');
  });

  // ---- Reel upload to Cloudinary ----
  document.getElementById('upload-reel-btn').addEventListener('click', () => {
    if (!currentReelFile) return toast('Error', 'Select a video first');
    const caption = document.getElementById('reel-caption').value.trim();

    const btn = document.getElementById('upload-reel-btn');
    document.getElementById('reel-btn-text').classList.add('hidden');
    document.getElementById('reel-btn-spinner').classList.remove('hidden');
    btn.disabled = true;
    document.getElementById('reel-upload-progress').classList.remove('hidden');

    const formData = new FormData();
    formData.append('file', currentReelFile);
    formData.append('upload_preset', CLOUDINARY.uploadPreset);
    formData.append('resource_type', 'video');

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/video/upload`);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        document.getElementById('reel-progress-bar').style.width = pct + '%';
        document.getElementById('reel-progress-text').textContent = `Uploading… ${pct}%`;
      }
    };

    xhr.onload = async () => {
      const reset = () => {
        document.getElementById('reel-btn-text').classList.remove('hidden');
        document.getElementById('reel-btn-spinner').classList.add('hidden');
        btn.disabled = false;
      };
      try {
        const data = JSON.parse(xhr.responseText);
        if (data.error) throw new Error(data.error.message);
        const reelData = {
          id: 'reel_' + Date.now() + '_' + Math.floor(Math.random()*1000),
          userId: ME.uid,
          userName: ME.name,
          userAvatar: ME.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
          videoUrl: data.secure_url,
          thumbnail: data.thumbnail_url || data.secure_url,
          caption: caption || '',
          likes: {}, comments: {}, savedBy: [], views: 0, viewedUsers: {},
          createdAt: Date.now()
        };
        await push(ref(db, 'reels'), reelData);
        document.getElementById('reel-progress-text').textContent = 'Done!';
        toast('Reel Uploaded', 'Your reel is live');
        setTimeout(() => window.location.replace('reels.html'), 900);
      } catch (e) {
        toast('Upload Failed', e.message);
        reset();
      }
    };
    xhr.onerror = () => {
      toast('Upload Failed', 'Network error');
      document.getElementById('reel-btn-text').classList.remove('hidden');
      document.getElementById('reel-btn-spinner').classList.add('hidden');
      btn.disabled = false;
    };
    xhr.send(formData);
  });

  // ---- Comment modal ----
  let activePostId = null;
  let commentUnsub = null;

  async function openCommentModal(postId) {
    activePostId = postId;
    document.getElementById('comment-modal').classList.remove('hidden');
    if (commentUnsub) { commentUnsub(); commentUnsub = null; }

    // Load post + comments live
    const snap = await get(ref(db, 'publications'));
    const data = snap.val() || {};
    let dbKey = null;
    for (const k of Object.keys(data)) {
      if (data[k] && data[k].id === postId) { dbKey = k; break; }
    }
    if (!dbKey) return;

    document.getElementById('comment-post-body').textContent = data[dbKey].text || '';

    const unsub = onValue(ref(db, `publications/${dbKey}/comments`), (s) => {
      const list = s.val() || {};
      renderComments(list, dbKey);
    });
    commentUnsub = () => { /* Firebase v9 onValue returns unsubscribe */ };
    // onValue already returns unsubscribe — capture it properly:
    const realUnsub = onValue(ref(db, `publications/${dbKey}/comments`), (s) => {
      const list = s.val() || {};
      renderComments(list, dbKey);
    });
    commentUnsub = realUnsub;
  }

  function renderComments(list, dbKey) {
    const c = document.getElementById('comment-list');
    c.innerHTML = '';
    const keys = Object.keys(list);
    if (!keys.length) {
      c.innerHTML = `<p class="text-[10px] text-slate-600 italic text-center py-3">No comments yet</p>`;
      return;
    }
    keys.sort((a,b) => (list[a].timestamp||0) - (list[b].timestamp||0));
    keys.forEach(k => {
      const item = list[k];
      const isMine = item.authorUID === ME.uid;
      const row = document.createElement('div');
      row.className = 'bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs flex justify-between items-start gap-2';
      row.innerHTML = `
        <div>
          <p class="font-bold text-slate-400">@${item.authorName}</p>
          <p class="text-slate-300">${item.text}</p>
        </div>
        ${isMine ? `<button class="text-red-400 p-1" data-del>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>` : ''}
      `;
      if (isMine) {
        row.querySelector('[data-del]').addEventListener('click', async () => {
          if (!confirm('Delete comment?')) return;
          await remove(ref(db, `publications/${dbKey}/comments/${k}`));
        });
      }
      c.appendChild(row);
    });
    c.scrollTop = c.scrollHeight;
  }

  document.getElementById('close-comment-modal').addEventListener('click', () => {
    document.getElementById('comment-modal').classList.add('hidden');
    if (commentUnsub) { commentUnsub(); commentUnsub = null; }
    activePostId = null;
  });

  document.getElementById('comment-send-btn').addEventListener('click', async () => {
    const input = document.getElementById('comment-input');
    const txt = input.value.trim();
    if (!txt || !activePostId) return;

    const snap = await get(ref(db, 'publications'));
    const data = snap.val() || {};
    let dbKey = null, postOwner = null;
    for (const k of Object.keys(data)) {
      if (data[k] && data[k].id === activePostId) { dbKey = k; postOwner = data[k].authorUID; break; }
    }
    if (!dbKey) return;

    await push(ref(db, `publications/${dbKey}/comments`), {
      authorUID: ME.uid,
      authorName: ME.name,
      text: txt,
      timestamp: Date.now()
    });
    input.value = '';

    if (postOwner && postOwner !== ME.uid) {
      try {
        const nSnap = await get(ref(db, `users/${postOwner}/notifications`));
        const arr = Array.isArray(nSnap.val()) ? nSnap.val() : [];
        arr.unshift({
          id: 'n_' + Date.now(),
          type: 'comment',
          message: `${ME.name} commented on your post: "${txt}"`,
          targetUserId: postOwner,
          sourceUserId: ME.uid,
          postId: activePostId,
          timestamp: Date.now(),
          read: false
        });
        const cutoff = Date.now() - 7*24*60*60*1000;
        await set(ref(db, `users/${postOwner}/notifications`), arr.filter(n => n.timestamp > cutoff).slice(0,50));
      } catch (e) {}
    }
  });
</script>
</body>
</html>
